<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Design Aura - Kadıköy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --gold-dark: #a07840;
            --dark: #1a1a2e;
            --dark-soft: #2d2d3e;
            --text-dark: #1c1c1c;
            --text-mid: #444444;
            --text-light: #777777;
            --white: #ffffff;
            --light-bg: #f8f7f4;
            --light-gray: #f0eeea;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--white);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(201, 169, 110, 0.2);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .nav-logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 1px;
        }

        .nav-logo-text span {
            color: var(--gold-dark);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-mid);
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.85rem !important;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-weight: 600 !important;
            letter-spacing: 1px !important;
            transition: all 0.3s !important;
            box-shadow: 0 4px 15px rgba(201,169,110,0.3);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201,169,110,0.4) !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        /* HAMBURGER */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--text-dark);
            transition: 0.3s;
            border-radius: 2px;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 20px;
            border-bottom: 1px solid var(--light-gray);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 999;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 14px 0;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1rem;
            border-bottom: 1px solid var(--light-gray);
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
        }

        .mobile-menu a:last-child {
            border-bottom: none;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #fdfcfa 0%, #f5f0e8 40%, #ede5d5 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201,169,110,0.12);
            border: 1px solid rgba(201,169,110,0.3);
            color: var(--gold-dark);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .hero-badge::before {
            content: '✦';
            font-size: 0.7rem;
        }

        .hero-title {
            font-size: 3.5rem;
            line-height: 1.15;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero-title strong {
            display: block;
            color: var(--gold-dark);
            font-weight: 700;
            font-style: italic;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-mid);
            line-height: 1.8;
            margin-bottom: 35px;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.95rem;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(201,169,110,0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(201,169,110,0.45);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text-dark);
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.95rem;
            font-family: 'Arial', sans-serif;
            font-weight: 500;
            border: 1.5px solid rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold-dark);
            background: rgba(201,169,110,0.06);
        }

        .hero-stats {
            display: flex;
            gap: 35px;
            margin-top: 50px;
            padding-top: 35px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .stat-item {
            text-align: left;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold-dark);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .hero-image-side {
            position: relative;
        }

        .hero-card-main {
            background: var(--white);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }

        .hero-card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hero-card-title {
            font-size: 1.4rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .hero-card-text {
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .hero-floating-card {
            position: absolute;
            background: var(--white);
            border-radius: 15px;
            padding: 18px 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero-floating-card.card1 {
            bottom: -20px;
            left: -30px;
            z-index: 3;
        }

        .hero-floating-card.card2 {
            top: -20px;
            right: -20px;
            z-index: 3;
        }

        .floating-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #f0eeea, var(--gold-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .floating-text strong {
            display: block;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .floating-text span {
            font-size: 0.75rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
        }

        .stars-display {
            color: var(--gold);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* ABOUT STRIP */
        .about-strip {
            background: linear-gradient(135deg, var(--dark), var(--dark-soft));
            padding: 50px 5%;
        }

        .about-strip-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            text-align: center;
        }

        .strip-item {
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.08);
        }

        .strip-item:last-child {
            border-right: none;
        }

        .strip-icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .strip-title {
            color: var(--gold-light);
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .strip-desc {
