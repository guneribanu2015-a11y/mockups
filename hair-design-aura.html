<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Design Aura - Kadıköy, İstanbul</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #b8924a;
    --gold-light: #d4af70;
    --gold-pale: #f5e6cc;
    --dark: #1a1a1a;
    --dark-mid: #333333;
    --gray: #666666;
    --light-gray: #f7f5f2;
    --white: #ffffff;
    --border: #e8ddd0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Raleway', sans-serif;
    background-color: var(--white);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: var(--light-gray);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--gold);
    border-radius: 3px;
  }

  /* NAVIGATION */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s ease;
  }

  nav.scrolled {
    box-shadow: 0 4px 30px rgba(0,0,0,0.08);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .nav-logo-main {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 1px;
  }

  .nav-logo-sub {
    font-size: 10px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    transition: color 0.3s;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.3s;
  }

  .nav-links a:hover {
    color: var(--gold);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--gold);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 2px;
    text-decoration: none;
    font-size: 12px !important;
    font-weight: 600 !important;
    letter-spacing: 2px !important;
    text-transform: uppercase;
    transition: background 0.3s, transform 0.2s !important;
    display: inline-block;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    background: var(--dark) !important;
    color: var(--white) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    width: 24px;
    height: 2px;
    background: var(--dark);
    transition: all 0.3s;
    display: block;
  }

  .hamburger.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
  }

  .mobile-menu {
    display: none;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 20px 24px 28px;
    flex-direction: column;
    gap: 20px;
  }

  .mobile-menu.open {
    display: flex;
  }

  .mobile-menu a {
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: var(--dark-mid);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s;
  }

  .mobile-menu a:hover {
    color: var(--gold);
  }

  .mobile-menu .mobile-cta {
    background: var(--gold);
    color: var(--white);
    text-align: center;
    padding: 14px;
    border-radius: 2px;
    font-weight: 600;
    letter-spacing: 2px;
    border: none;
    margin-top: 4px;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #faf8f5 0%, #f0ebe3 50%, #faf8f5 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding-top: 72px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(184,146,74,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(184,146,74,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 50px;
    margin-bottom: 28px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    box-shadow: 0 2px 12px rgba(184,146,74,0.1);
  }

  .hero-badge-dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 5vw, 68px);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 24px;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold);
    display: block;
  }

  .hero-desc {
    font-size: 16px;
    color: var(--gray);
    line-height: 1.8;
    margin-bottom: 40px;
    font-weight: 400;
    max-width: 480px;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: var(--white);
    padding: 16px 36px;
    font-family: 'Raleway', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(184,146,74,0.3);
  }

  .btn-primary:hover {
    background: var(--dark);
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    transform: translateY(-2px);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--dark);
    padding: 16px 28px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(184,146,74,0.04);
  }

  .hero-stats {
    display: flex;
    gap: 36px;
    margin-top: 52px;
    padding-top: 36px;
    border-top: 1px solid var(--border);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--dark);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 500;
  }

  .hero-visual {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  .hero-img-main {
    width: 100%;
    height: 380px;
    background: linear-gradient(135deg, #e8ddd0, #d4c4b0);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-img-main::before {
    content: '✂';
    font-size: 80px;
    color: rgba(255,255,255,0.3);
    position: absolute;
  }

  .hero-img-main-inner {
    background: linear-gradient(135deg, #c9b89a 0%, #b8a080 40%, #a08060 100%);
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    padding: 24px;
  }

  .hero-img-tag {
    background: var(--white);
    padding: 12px 18px;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }

  .hero-img-tag-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--dark);
  }

  .hero-img-tag-sub {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-top: 2px;
    font-weight: 500;
  }

  .hero-img-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .hero-img-small {
    height: 140px;
    background: linear-gradient(135deg, #e0d5c5, #cfc0a8);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }

  .hero-img-small::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.1) 100%);
  }

  .hero-float-badge {
    position: absolute;
    top: 20px;
    right: -16px;
    background
