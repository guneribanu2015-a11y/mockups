<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Design Aura | Kadıköy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --black: #0a0a0a;
    --dark: #111111;
    --dark2: #1a1a1a;
    --gray: #2a2a2a;
    --text: #e8e0d5;
    --text-muted: #9a9089;
    --white: #faf8f5;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--black);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all .4s ease;
    background: transparent;
  }
  nav.scrolled {
    background: rgba(10,10,10,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(201,169,110,.15);
    padding: .9rem 2rem;
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.55rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: .08em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--white); font-weight: 300; font-style: italic; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: .75rem;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: color .3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    background: var(--gold);
    color: var(--black) !important;
    padding: .55rem 1.4rem;
    border-radius: 2px;
    font-weight: 600 !important;
    transition: background .3s !important;
  }
  .nav-cta:hover { background: var(--gold-light) !important; color: var(--black) !important; }

  /* ── HAMBURGER ── */
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; z-index: 1100; }
  .hamburger span {
    width: 24px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all .3s;
  }
  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

  .mobile-menu {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,.97);
    backdrop-filter: blur(20px);
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    color: var(--text);
    text-decoration: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: .1em;
    transition: color .3s;
  }
  .mobile-menu a:hover { color: var(--gold); }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--dark);
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(201,169,110,.09) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 20% 80%, rgba(160,120,64,.06) 0%, transparent 50%);
  }

  .hero-lines {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .hero-lines::before {
    content: '';
    position: absolute;
    top: -50%;
    right: 8%;
    width: 1px;
    height: 200%;
    background: linear-gradient(to bottom, transparent, rgba(201,169,110,.2), transparent);
    animation: lineSlide 6s ease-in-out infinite;
  }
  .hero-lines::after {
    content: '';
    position: absolute;
    top: -50%;
    right: 18%;
    width: 1px;
    height: 200%;
    background: linear-gradient(to bottom, transparent, rgba(201,169,110,.1), transparent);
    animation: lineSlide 6s ease-in-out infinite .8s;
  }
  @keyframes lineSlide {
    0%,100% { transform: translateY(-5%); }
    50% { transform: translateY(5%); }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    max-width: 900px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: rgba(201,169,110,.1);
    border: 1px solid rgba(201,169,110,.25);
    border-radius: 50px;
    padding: .45rem 1.2rem;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2rem;
    animation: fadeUp .8s ease both;
  }
  .hero-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(201,169,110,.4); }
    50% { box-shadow: 0 0 0 6px rgba(201,169,110,0); }
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -.01em;
    margin-bottom: .3rem;
    animation: fadeUp .8s ease .15s both;
  }
  .hero-title strong {
    display: block;
    font-weight: 600;
    color: var(--gold);
    font-style: italic;
  }

  .hero-subtitle {
    font-size: clamp(.85rem, 2vw, 1rem);
    color: var(--text-muted);
    letter-spacing: .25em;
    text-transform: uppercase;
    font-weight: 300;
    margin-bottom: 1rem;
    animation: fadeUp .8s ease .3s both;
  }

  .hero-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 1.8rem auto;
    animation: fadeUp .8s ease .4s both;
  }
  .hero-divider::before,
  .hero-divider::after {
    content: '';
    width: 80px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .hero-divider::after { transform: scaleX(-1); }
  .hero-divider span {
    color: var(--gold);
    font-size: .55rem;
    letter-spacing: .4em;
    text-transform: uppercase;
  }

  .hero-desc {
    font-size: clamp(.85rem, 1.5vw, 1rem);
    color: var(--text-muted);
    font-weight: 300;
    line-height: 1.9;
    max-width: 520px;
    margin: 0 auto 3rem;
    animation: fadeUp .8s ease .5s both;
  }

  .hero-buttons {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp .8s ease .6s both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    background: var(--gold);
    color: var(--black);
    padding: 1rem 2.2rem;
    border-radius: 2px;
    font-weight: 700;
    font-size: .8rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all .3s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
    opacity: 0;
    transition: opacity .3s;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 12px 35px rgba(201,169,110,.35); }
  .btn-primary:hover::before { opacity: 1; }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    background: transparent;
    color: var(--gold);
    padding: 1rem 2.2rem;
    border-radius: 2px;
    border: 1px solid rgba(201,169,110,.4);
    font-weight: 500;
    font-size: .8rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all .3s;
  }
  .btn-outline:hover {
    border-color: var(--gold);
    background: rgba(201,169,110,.08);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 3rem;
    margin-top: 5rem;
    padding-top: 3rem;
    border-top: 1px solid rgba(201,169,110,.1);
    animation: fadeUp .8s ease .8s both;
    flex-wrap: wrap;
  }
  .hero-stat { text-align: center; }
  .hero-stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }
  .hero-stat-label {
    font-size: .65rem;
    color: var(--text-muted);
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-top: .4rem;
  }

  .scroll-indicator {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    color: var(--text-muted);
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    animation: fadeUp 1s ease 1s both;
  }
  .scroll-indicator::after {
    content: '';
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollLine 1.8s ease-in-out infinite;
  }
  @keyframes scrollLine {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── SECTION COMMON ── */
  section { padding: 7rem 2rem; }
  .section-tag {
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 300;
    line-height: 1.1;
    margin-bottom: 1.5rem;
  }
  .section-title em { color: var(--gold); font-style: italic; }
  .section-desc {
    color: var(--text-muted);
    font-size: .9rem;
    line-height: 1.9;
    font-weight: 300;
    max-width: 500px;
  }

  /* ── ABOUT STRIP ── */
  #about {
    background: var(--dark2);
