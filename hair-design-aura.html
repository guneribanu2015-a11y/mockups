<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Design Aura | Kadıköy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --dark: #1a1a1a;
    --text: #2d2d2d;
    --text-light: #666;
    --white: #ffffff;
    --bg-light: #f8f7f5;
    --bg-section: #faf9f7;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.6;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,169,110,0.2);
    padding: 0 5%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 1px;
  }

  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-btn {
    background: var(--gold);
    color: var(--white) !important;
    padding: 0.5rem 1.2rem;
    border-radius: 25px;
    font-size: 0.85rem !important;
  }

  .nav-btn:hover { background: #b8925a; color: var(--white) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 2px;
    background: var(--dark);
    transition: 0.3s;
    display: block;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdf9f4 0%, #f5efe6 50%, #ede4d8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 5% 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 60% 40%, rgba(201,169,110,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(201,169,110,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.4);
    color: #8a6a35;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.4rem 1.2rem;
    border-radius: 20px;
    margin-bottom: 1.5rem;
  }

  .hero h1 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 800;
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 0.5rem;
    letter-spacing: -1px;
  }

  .hero h1 span { color: var(--gold); }

  .hero-sub {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: var(--text-light);
    margin-bottom: 1.5rem;
    font-weight: 300;
    letter-spacing: 1px;
  }

  .hero-desc {
    font-size: 1rem;
    color: var(--text-light);
    max-width: 500px;
    margin: 0 auto 2.5rem;
    line-height: 1.8;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--gold);
    color: var(--white);
    padding: 1rem 2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(201,169,110,0.4);
  }

  .btn-primary:hover {
    background: #b8925a;
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(201,169,110,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent;
    color: var(--dark);
    padding: 1rem 2rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border: 2px solid rgba(0,0,0,0.15);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 2.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--dark);
    display: block;
    line-height: 1;
  }

  .stat-num span { color: var(--gold); }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 0.3rem;
    display: block;
  }

  .stat-divider {
    width: 1px;
    background: rgba(0,0,0,0.1);
    align-self: stretch;
    min-height: 40px;
  }

  /* SECTIONS COMMON */
  section { padding: 80px 5%; }

  .section-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.8rem;
    display: block;
  }

  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 1rem;
    letter-spacing: -0.5px;
  }

  .section-desc {
    color: var(--text-light);
    font-size: 1rem;
    max-width: 550px;
    line-height: 1.8;
  }

  /* ABOUT STRIP */
  .about-strip {
    background: var(--dark);
    padding: 50px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .about-strip-text h2 {
    font-size: clamp(1.5rem, 3vw, 2rem);
    color: var(--white);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .about-strip-text p {
    color: rgba(255,255,255,0.6);
    font-size: 0.95rem;
  }

  .about-strip-items {
    display: flex;
    gap: 2.5rem;
    flex-wrap: wrap;
  }

  .strip-item {
    text-align: center;
  }

  .strip-item-icon {
    font-size: 1.5rem;
    margin-bottom: 0.3rem;
    display: block;
  }

  .strip-item-text {
    color: var(--gold-light);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* SERVICES */
  .services { background: var(--bg-light); }

  .services-header {
    max-width: 1200px;
    margin: 0 auto 3rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .services-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  .service-card {
    background: var(--white);
    border-radius: 20px;
    padding: 2rem;
    border: 1px solid rgba(201,169,110,0.1);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--gold);
    transform: scaleY(0);
    transition: transform 0.3s;
    transform-origin: bottom;
  }

  .service-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    border-color: rgba(201,169,110,0.3);
  }

  .service-card:hover::before { transform: scaleY(1); }

  .service-icon {
    width: 55px;
    height: 55px;
    background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 1.2rem;
    border: 1px solid rgba(201,169,110,0.2);
  }

  .service-card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 0.5rem;
  }

  .service-card p {
    font-size: 0.88rem;
    color: var(--text-light);
    line-height: 1.7;
    margin-bottom: 1.2rem;
  }

  .service-price {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .price {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
  }

  .service-tag {
    font-size: 0.7rem;
    background: rgba(201,169,110,0.1);
    color: #8a6a35;
    padding: 0.2rem 0.7rem;
    border-radius: 10px;
    font-weight: 600;
  }

  /* FEATURED SERVICE */
  .featured-service {
    max-width: 1200px;
    margin: 1.5rem auto 0;
    background: linear-gradient(135deg, var(--dark) 0%, #2d2520 100%);
    border-radius: 25px;
    padding: 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .featured-service-text h3 {
    font-size: 1.5rem;
    color: var(--white);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .featured-service-text p {
    color: rgba(255,255,255,0.6);
    font-size: 0.95rem;
    max-width: 400px;
  }

  .featured-badge {
    display: inline-block;
    background: rgba(201,169,110,0.2);
    color: var(--gold-light);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 10px;
    margin-bottom: 0.8rem;
  }

  /* REVIEWS */
  .reviews { background: var(--white); }

  .reviews-header {
    max-width: 1200px;
    margin: 0 auto 3rem;
    text-align: center;
  }

  .stars-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .stars { color: #f59e0b; font-size: 1.5rem
