<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Live Studio | Bayan Kuaförü – Kadıköy</title>
<meta name="description" content="Kadıköy'ün en gözde bayan kuaförü New Live Studio. Saç kesimi, boyama, keratin, fön ve daha fazlası. Hemen randevu alın!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:       #c9748f;
    --rose-dark:  #a85570;
    --rose-light: #f5dce5;
    --gold:       #d4a96a;
    --gold-light: #f5e9d6;
    --dark:       #1a1015;
    --dark-2:     #2d1e26;
    --mid:        #6b4f5c;
    --light:      #fdf7f9;
    --white:      #ffffff;
    --text:       #3d2b35;
    --text-light: #8a6b77;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--light);
    overflow-x: hidden;
  }

  /* ── NAV ────────────────────────────────── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background .4s, backdrop-filter .4s, box-shadow .4s;
  }
  nav.scrolled {
    background: rgba(253,247,249,.92);
    backdrop-filter: blur(16px);
    box-shadow: 0 2px 30px rgba(201,116,143,.12);
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.1;
    letter-spacing: .02em;
    transition: color .3s;
  }
  nav.scrolled .nav-logo { color: var(--rose-dark); }
  .nav-logo span { display: block; font-size: .65rem; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; font-family: 'Inter', sans-serif; opacity: .85; }
  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--rose);
    color: var(--white);
    padding: 10px 22px;
    border-radius: 50px;
    font-size: .82rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .3s, transform .2s, box-shadow .3s;
    box-shadow: 0 4px 18px rgba(201,116,143,.4);
  }
  .nav-cta:hover { background: var(--rose-dark); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(168,85,112,.45); }

  /* ── HERO ───────────────────────────────── */
  .hero {
    min-height: 100svh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(140deg, #1a1015 0%, #2d1020 40%, #4a1b30 70%, #1a0d15 100%);
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 30%, rgba(201,116,143,.22) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 70%, rgba(212,169,106,.18) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 0%, rgba(201,116,143,.12) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero-particles {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .hero-particles span {
    position: absolute;
    border-radius: 50%;
    background: var(--rose);
    opacity: 0;
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translateY(0) scale(1); }
    15%  { opacity: .5; }
    85%  { opacity: .2; }
    100% { opacity: 0; transform: translateY(-100vh) scale(.4); }
  }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: 120px 20px 80px;
    max-width: 820px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(212,169,106,.15);
    border: 1px solid rgba(212,169,106,.35);
    color: var(--gold);
    padding: 7px 18px;
    border-radius: 50px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 28px;
    backdrop-filter: blur(8px);
  }
  .hero-badge .star { font-size: .9rem; }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 14px;
    letter-spacing: -.01em;
  }
  .hero h1 em {
    font-style: italic;
    background: linear-gradient(120deg, var(--rose-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-size: clamp(.95rem, 2.5vw, 1.15rem);
    color: rgba(255,255,255,.65);
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto 44px;
    line-height: 1.7;
    letter-spacing: .01em;
  }
  .hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-decoration: none;
    transition: transform .25s, box-shadow .25s;
    box-shadow: 0 8px 32px rgba(201,116,143,.5);
  }
  .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 14px 40px rgba(168,85,112,.6); }
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.22);
    color: var(--white);
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    backdrop-filter: blur(8px);
    transition: background .25s, border-color .25s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
  .hero-stats {
    position: absolute;
    bottom: 48px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 48px;
    z-index: 2;
  }
  .stat {
    text-align: center;
    color: var(--white);
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(120deg, var(--rose-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: 4px; }
  .hero-scroll {
    position: absolute;
    bottom: 28px; right: 40px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,.35);
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,.4), transparent);
    animation: scroll-anim 1.8s ease-in-out infinite;
  }
  @keyframes scroll-anim {
    0%, 100% { transform: scaleY(1); opacity: .4; }
    50%       { transform: scaleY(.6); opacity: 1; }
  }

  /* ── SECTION SHARED ─────────────────────── */
  section { padding: 100px 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .section-tag {
    display: inline-block;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 14px;
    position: relative;
    padding-left: 28px;
  }
  .section-tag::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 1px;
    background: var(--rose);
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 4.5vw, 3rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .section-title em { font-style: italic; color: var(--rose-dark); }
  .section-desc {
    font-size: 1rem;
    color: var(--text-light);
    line-height: 1.75;
    max-width: 540px;
  }
  .section-header { margin-bottom: 60px; }

  /* ── ABOUT STRIP ────────────────────────── */
  .about-strip {
    background: linear-gradient(135deg, var(--dark-2), #3d1528);
    padding: 60px 20px;
    overflow: hidden;
    position: relative;
  }
  .about-strip::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 100% at 100% 50%, rgba(212,169,106,.1) 0%, transparent 60%);
    pointer-events: none;
  }
  .about-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 60px;
    flex-wrap: wrap;
  }
  .about-text { flex: 1; min-width: 280px; }
  .about-text .section-tag { color: var(--gold); }
  .about-text .section-tag::before { background: var(--gold); }
  .about-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    color: var(--white);
    margin-bottom: 16px;
    line-height: 1.25;
  }
  .about-title em { font-style: italic; color: var(--gold); }
  .about-desc {
    color: rgba(255,255,255,.6);
    line-height: 1.8;
    font-size: .95rem;
    margin-bottom: 28px;
  }
  .about-pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.8);
    padding: 7px 16px;
    border-radius: 50px;
    font-size: .78rem;
    letter-spacing: .04em;
    backdrop-filter: blur(4px);
  }
  .about-cards {
    display: flex;
    gap: 16px;
    flex: 0 0 auto;
  }
  .about-card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    backdrop-filter: blur(8px);
    min-width: 120px;
  }
  .about-card-icon { font-
