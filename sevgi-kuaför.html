<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sevgi Kuaför - Kadıköy'ün en seçkin kuaför salonu. Profesyonel saç bakımı, renklendirme ve şekillendirme hizmetleri.">
<title>Sevgi Kuaför | Kadıköy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #c9748a;
    --rose-dark: #a85870;
    --rose-light: #f4e0e6;
    --cream: #fdf8f5;
    --dark: #1a1014;
    --mid: #4a3040;
    --light-text: #7a6070;
    --gold: #c8a96a;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(253,248,245,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(201,116,138,0.15);
    transition: box-shadow .3s;
  }
  nav.scrolled { box-shadow: 0 4px 30px rgba(0,0,0,0.08); }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--rose-dark);
    letter-spacing: 0.5px;
  }
  .nav-logo span { color: var(--gold); }

  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a {
    text-decoration: none;
    font-size: .875rem;
    font-weight: 500;
    color: var(--mid);
    letter-spacing: .5px;
    text-transform: uppercase;
    position: relative;
    transition: color .3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 2px;
    background: var(--rose);
    transition: width .3s;
    border-radius: 2px;
  }
  .nav-links a:hover { color: var(--rose-dark); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    background: var(--rose);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: .8rem !important;
    font-weight: 600 !important;
    letter-spacing: .8px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .3s, transform .2s, box-shadow .3s;
    box-shadow: 0 4px 18px rgba(201,116,138,0.3);
  }
  .nav-cta:hover {
    background: var(--rose-dark) !important;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(201,116,138,0.4);
  }
  .nav-cta::after { display: none !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }
  .hamburger span {
    display: block;
    width: 26px; height: 2px;
    background: var(--rose-dark);
    border-radius: 2px;
    transition: all .3s;
  }
  .hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 70px; left: 0; right: 0;
    background: rgba(253,248,245,0.97);
    backdrop-filter: blur(20px);
    padding: 24px 32px 32px;
    border-bottom: 1px solid rgba(201,116,138,0.15);
    flex-direction: column;
    gap: 20px;
    z-index: 998;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    color: var(--mid);
    letter-spacing: .5px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(201,116,138,0.1);
    transition: color .3s;
  }
  .mobile-menu a:hover { color: var(--rose-dark); }
  .mobile-menu .m-cta {
    display: block;
    text-align: center;
    background: var(--rose);
    color: var(--white);
    padding: 14px;
    border-radius: 50px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    font-size: .85rem;
    margin-top: 8px;
    border: none;
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 120px 40px 80px;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(201,116,138,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(200,169,106,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(201,116,138,0.08) 0%, transparent 40%);
    z-index: 0;
  }

  .hero-pattern {
    position: absolute;
    top: 0; right: 0;
    width: 55%;
    height: 100%;
    background:
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9748a' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: .6;
    z-index: 0;
  }

  /* Floating shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
    animation: floatShape 6s ease-in-out infinite;
  }
  .shape-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(201,116,138,0.12), transparent 70%);
    top: -80px; right: -100px;
    animation-delay: 0s;
  }
  .shape-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(200,169,106,0.1), transparent 70%);
    bottom: 50px; right: 200px;
    animation-delay: 2s;
  }
  .shape-3 {
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(201,116,138,0.08), transparent 70%);
    top: 30%; left: 40%;
    animation-delay: 4s;
  }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 700px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,116,138,0.1);
    border: 1px solid rgba(201,116,138,0.25);
    color: var(--rose-dark);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 50px;
    margin-bottom: 28px;
    animation: fadeInUp .8s ease forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .hero-badge .dot {
    width: 6px; height: 6px;
    background: var(--rose);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--dark);
    margin-bottom: 24px;
    animation: fadeInUp .8s ease .15s forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .hero-title .highlight {
    color: var(--rose-dark);
    position: relative;
    display: inline-block;
  }
  .hero-title .highlight::after {
    content: '';
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, rgba(201,116,138,0.25), rgba(200,169,106,0.25));
    border-radius: 3px;
    z-index: -1;
  }
  .hero-title .gold { color: var(--gold); }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--light-text);
    line-height: 1.8;
    max-width: 520px;
    margin-bottom: 40px;
    font-weight: 300;
    animation: fadeInUp .8s ease .3s forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    animation: fadeInUp .8s ease .45s forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    color: var(--white);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 600;
    font-size: .95rem;
    letter-spacing: .5px;
    transition: transform .3s, box-shadow .3s;
    box-shadow: 0 8px 30px rgba(201,116,138,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(201,116,138,0.5);
  }
  .btn-primary svg { width: 18px; height: 18px; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--mid);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-weight: 500;
    font-size: .95rem;
    border: 1.5px solid rgba(74,48,64,0.2);
    transition: all .3s;
  }
  .btn-secondary:hover {
    border-color: var(--rose);
    color: var(--rose-dark);
    background: rgba(201,116,138,0.05);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 40px;
    margin-top: 60px;
    animation: fadeInUp .8s ease .6s forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  .stat-item { text-align: left; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--rose-dark);
    line-height: 1;
  }
  .stat-label {
    font-size: .78rem;
    color: var(--light-text);
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .stat-divider {
    width: 1px;
    background: rgba(201,116,138,0.2);
    align-self:
