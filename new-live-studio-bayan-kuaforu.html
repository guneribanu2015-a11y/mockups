<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Live Studio Bayan Kuaförü | Kadıköy, İstanbul</title>
    <meta name="description" content="New Live Studio Bayan Kuaförü - Kadıköy'ün en prestijli kuaför salonu. 4.9 yıldız ile 354 memnun müşteri. Randevu için hemen arayın.">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #b8860b;
            --primary-light: #d4a017;
            --primary-pale: #f5e6c8;
            --accent: #8b6914;
            --text-dark: #1a1a1a;
            --text-medium: #3d3d3d;
            --text-light: #666666;
            --bg-white: #ffffff;
            --bg-light: #fafaf8;
            --bg-cream: #fdf8f2;
            --border: #e8ddd0;
            --shadow: rgba(184, 134, 11, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ── NAVİGASYON ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: box-shadow 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .nav-logo-main {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .nav-logo-sub {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-light);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-medium);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff !important;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.8rem !important;
            letter-spacing: 1px !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow) !important;
            color: #fff !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--text-dark);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 72px;
            left: 0;
            width: 100%;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 20px 24px 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            z-index: 999;
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-menu ul a {
            display: block;
            padding: 12px 0;
            text-decoration: none;
            color: var(--text-medium);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid #f0ece6;
            transition: color 0.3s;
        }

        .mobile-menu ul a:hover {
            color: var(--primary);
        }

        .mobile-menu-cta {
            display: block;
            margin-top: 18px;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #fdf8f2 0%, #faf5ee 40%, #f5ede0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 100px 24px 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -150px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,160,23,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -100px;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,134,11,0.09) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-ornament-left {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 200px;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            opacity: 0.4;
        }

        .hero-ornament-right {
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 200px;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            opacity: 0.4;
        }

        .hero-content {
            max-width: 820px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.85);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 20px;
            margin-bottom: 32px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }

        .hero-badge .star {
            color: #f5a623;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .hero-title span {
            color: var(--primary);
            font-style: italic;
        }

        .hero-subtitle-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 20px 0 24px;
        }

        .hero-subtitle-line hr {
            width: 60px;
            border: none;
            border-top: 1px solid var(--primary);
            opacity: 0.5;
        }

        .hero-subtitle-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .hero-desc {
            font-size: 1rem;
            color: var(--text-light);
            max-width: 560px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 56px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary), var(--accent));
            color: #fff;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 28px var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 38px rgba(184,134,11,0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--primary);
            text-decoration: none;
            padding: 15px 32px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            border: 1.5px solid var(--primary);
            transition: all 0.25s ease;
        }

        .btn-secondary:hover {
            background: var(--primary-pale);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            flex-wrap: wrap;
        }

        .hero-stat {
            padding: 20px 36px;
            text-align: center;
            position: relative;
        }

        .hero-stat + .hero-stat::before {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background: var(--border);
        }

        .hero-stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            line-height: 1;
        }

        .hero-stat-label {
            font-size: 0.72rem;
            color: var(--text-light);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 6px;
            display: block;
        }

        /* ── BÖLÜM BAŞLIKLARI ── */
        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 14px;
        }

            font-size: clamp(1.8rem, 4vw, 2.
