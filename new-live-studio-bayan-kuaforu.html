<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Live Studio - Bayan Kuaförü | Kadıköy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c9a96e;
            --primary-dark: #b8934f;
            --secondary: #2d2d2d;
            --text: #1a1a1a;
            --text-light: #555;
            --bg: #fafafa;
            --bg-section: #f4f1ec;
            --white: #ffffff;
            --border: #e8e0d5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .nav-logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-cta {
            background: var(--primary);
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s !important;
        }

        .nav-cta:hover {
            background: var(--primary-dark) !important;
            transform: translateY(-1px);
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* HERO */
        #hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf9f5 0%, #f5ede0 40%, #ede0cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        #hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        #hero::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 780px;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Arial', sans-serif;
            font-size: 0.82rem;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .hero-badge::before {
            content: '✦';
            color: var(--primary);
            font-size: 0.9rem;
        }

        .hero-title {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            color: var(--primary);
            font-style: italic;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--text-light);
            margin-bottom: 36px;
            font-style: italic;
            line-height: 1.6;
        }

        .hero-rating {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            padding: 12px 24px;
            border-radius: 50px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        .stars {
            color: #f4b942;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .rating-text strong {
            color: var(--text);
            font-size: 1rem;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 6px 24px rgba(201,169,110,0.4);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(201,169,110,0.5);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .hero-scroll {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        .hero-scroll::after {
            content: '↓';
            font-size: 1.2rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(6px); }
        }

        /* FEATURES STRIP */
        .features-strip {
            background: var(--white);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 28px 24px;
        }

        .features-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            background: var(--bg-section);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .feature-text h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
            font-family: 'Arial', sans-serif;
        }

        .feature-text p {
            font-size: 0.78rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
        }

        /* SECTIONS */
        section {
            padding: 90px 24px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            background: var(--bg-section);
            color: var(--primary-dark);
            padding: 6px 18px;
            border-radius: 20px;
            font-family: 'Arial', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--text);
            font-weight: 700;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .section-title span {
            color: var(--primary);
            font-style: italic;
        }

        .section-desc {
            font-size: 1rem;
            color: var(--text-light);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.7;
            font-family: 'Arial', sans-serif;
        }

        .section-divider {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* SERVICES */
        #hizmetler {
            background: var(--bg-section);
        }

        .services-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .service-card:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-section);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }

        .service-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .service-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            color: var(--text-light);
            padding-bottom: 8px;
            border-bottom: 1px solid #f0ebe3;
        }

        .service-list li:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .service-list li::before {
            content: '✓';
            color: var(--primary);
            font-weight: 700;
            font-size: 0
