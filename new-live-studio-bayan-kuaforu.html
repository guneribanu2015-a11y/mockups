<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Live Studio Bayan Kuaförü | Kadıköy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #b8860b;
            --primary-light: #d4a017;
            --primary-dark: #8b6508;
            --accent: #c9a96e;
            --text-dark: #1a1a2e;
            --text-medium: #4a4a6a;
            --text-light: #6b7280;
            --bg-white: #ffffff;
            --bg-light: #f8f7f4;
            --bg-cream: #fdf9f3;
            --border: #e8e0d5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-dark);
            background-color: var(--bg-white);
            line-height: 1.6;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .nav-logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .nav-logo-sub {
            font-size: 0.65rem;
            color: var(--primary);
            font-family: 'Arial', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-medium);
            font-size: 0.85rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white !important;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 600 !important;
            transition: transform 0.3s, box-shadow 0.3s !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184, 134, 11, 0.4) !important;
            color: white !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
            background: var(--text-dark);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 14px 0;
            color: var(--text-dark);
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            transition: color 0.3s;
        }

        .mobile-menu a:last-child {
            border-bottom: none;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            text-align: center;
            border-radius: 25px;
            padding: 14px;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #fdf9f3 0%, #f8f3ea 40%, #fdf6ee 100%);
            display: flex;
            align-items: center;
            padding: 100px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201, 169, 110, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 8px 18px;
            font-family: 'Arial', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.1);
        }

        .hero-badge::before {
            content: '✦';
            font-size: 0.7rem;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 32px;
            max-width: 440px;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
            padding: 16px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 320px;
            border: 1px solid var(--border);
        }

        .stars {
            color: #f59e0b;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
        }

        .rating-score {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1;
        }

        .rating-count {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(184, 134, 11, 0.5);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            color: var(--text-dark);
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-card-main {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .hero-card-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--bg-cream), #f0e6d6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 24px;
        }

        .hero-card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .hero-card-sub {
            font-family: 'Arial', sans-serif;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .hero-card-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hero-card-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Arial', sans-serif;
            font-size: 0.85rem;
            color: var(--text-medium);
        }

        .feature-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            flex-shrink: 0;
        }

        .floating-card {
            position: absolute;
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-card-1 {
            top: -20px;
            right: -20px;
        }

        .floating-card-2 {
            bottom: -20px;
            left: -20px;
        }

        .floating-card-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .floating-card-icon.gold {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
        }

        .floating-card-icon.rose {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8);
        }

        .floating-card-text {
            font-family: 'Arial', sans-serif;
        }

        .floating-card-label {
            font-size: 0.65rem;
            color: var(--text-light);
            text
