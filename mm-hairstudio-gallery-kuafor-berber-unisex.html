<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM HairStudio Gallery | Kuaför-Berber Unisex | Kadıköy</title>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dark: #a07830;
    --dark: #1a1a1a;
    --mid: #3a3a3a;
    --soft: #6b6b6b;
    --bg: #f8f7f4;
    --bg2: #ffffff;
    --bg3: #f0ede6;
    --border: #e0dbd0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(248, 247, 244, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    font-style: italic;
    font-weight: bold;
    flex-shrink: 0;
  }

  .nav-logo-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  .nav-logo-sub {
    font-size: 10px;
    color: var(--soft);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 1px;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--mid);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.3s;
  }

  .nav-links a:hover { color: var(--gold-dark); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    background: var(--gold);
    color: #fff !important;
    padding: 8px 20px;
    border-radius: 2px;
    font-size: 12px !important;
    letter-spacing: 1.5px;
    transition: background 0.3s !important;
  }

  .nav-cta::after { display: none !important; }
  .nav-cta:hover { background: var(--gold-dark) !important; color: #fff !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--dark);
    transition: all 0.3s;
    border-radius: 2px;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    z-index: 999;
    flex-direction: column;
    gap: 0;
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    text-decoration: none;
    color: var(--mid);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    display: block;
  }

  .mobile-menu a:last-child { border-bottom: none; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
    background: linear-gradient(160deg, #ffffff 0%, #f5f0e8 40%, #ede6d8 100%);
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 760px;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.35);
    color: var(--gold-dark);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 30px;
    font-family: 'Arial', sans-serif;
    margin-bottom: 28px;
  }

  .hero-badge span { font-size: 14px; }

  .hero-title {
    font-size: clamp(36px, 7vw, 72px);
    font-weight: 400;
    color: var(--dark);
    line-height: 1.12;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold-dark);
  }

  .hero-title-sub {
    font-size: clamp(16px, 3vw, 22px);
    color: var(--soft);
    font-style: italic;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  .hero-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 24px;
  }

  .hero-desc {
    font-size: 17px;
    color: var(--soft);
    line-height: 1.75;
    margin-bottom: 16px;
    font-family: 'Arial', sans-serif;
    font-weight: 300;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-location {
    font-size: 13px;
    color: var(--soft);
    letter-spacing: 1px;
    margin-bottom: 40px;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .hero-location::before { content: '📍'; font-size: 14px; }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 52px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #fff;
    text-decoration: none;
    padding: 16px 36px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    font-weight: 600;
    border-radius: 2px;
    box-shadow: 0 8px 30px rgba(160,120,48,0.28);
    transition: all 0.3s;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 40px rgba(160,120,48,0.38);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--mid);
    text-decoration: none;
    padding: 15px 32px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    font-weight: 500;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 0;
    border-top: 1px solid var(--border);
    padding-top: 40px;
    flex-wrap: wrap;
  }

  .stat {
    padding: 0 40px;
    text-align: center;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 120px;
  }

  .stat:last-child { border-right: none; }

  .stat-number {
    font-size: 32px;
    font-weight: 300;
    color: var(--gold-dark);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--soft);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
  }

  .stars-row {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 6px;
  }

  .stars-row span { color: var(--gold); font-size: 20px; }

  /* ── SECTION COMMON ── */
  section { position: relative; }

  .section-header {
    text-align: center;
    margin-bottom: 56px;
  }

  .section-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    font-family: 'Arial', sans-serif;
    font-weight: 600;
    margin-bottom: 14px;
    padding: 5px 16px;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 20px;
    background: rgba(201,168,76,0.07);
  }

  .section-title {
    font-size: clamp(28px, 4.5vw, 44px);
    font-weight: 400;
    color: var(--dark);
    margin-bottom: 14px;
    line-height: 1.2;
  }

  .section-title em { font-style: italic; color: var(--gold-dark); }

  .section-line {
    width: 50px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 18px;
  }

  .section-desc {
    font-size: 16px;
    color: var(--soft);
    line-height: 1.7;
    max-width: 520px;
    margin: 0 auto;
    font-family: 'Arial', sans-serif;
    font-weight: 300;
  }

  /* ── SERVICES ── */
  #hizmetler {
    padding: 90px 24px;
    background: var(--bg2);
  }

  .services-container {
    max-width: 1100px;
    margin: 0 auto;
  }

  .services-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 9px 22px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--soft);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.3s;
  }

  .tab-btn.active, .tab-btn:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }

    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:
