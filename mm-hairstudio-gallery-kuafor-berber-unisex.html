<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM HairStudio Gallery | Kuaför-Berber Unisex | Kadıköy</title>
    <meta name="description" content="MM HairStudio Gallery - Kadıköy'ün en prestijli unisex kuaför ve berber salonu. Profesyonel saç bakımı, kesim ve styling hizmetleri.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C9A84C;
            --gold-light: #E8C97A;
            --gold-dark: #A07830;
            --dark: #1A1A1A;
            --dark-2: #2C2C2C;
            --gray-dark: #3D3D3D;
            --gray-mid: #6B6B6B;
            --gray-light: #F5F5F5;
            --white: #FFFFFF;
            --off-white: #FAFAFA;
            --border: #E0E0E0;
            --section-bg: #F8F6F2;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ===== NAVIGATION ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            transition: all 0.3s ease;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .nav-logo .logo-main {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 2px;
            font-style: italic;
        }

        .nav-logo .logo-sub {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-style: normal;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-dark);
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--dark);
            color: var(--white) !important;
            padding: 10px 22px;
            font-size: 12px !important;
            letter-spacing: 2px !important;
            border-radius: 2px;
            transition: background 0.3s !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background: var(--gold) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px 30px;
            z-index: 999;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-menu.open {
            display: flex;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--dark);
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu a:last-child {
            border-bottom: none;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #FEFEFE 0%, #F5F0E8 50%, #EDE5D8 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.1) 0%, transparent 70%);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1px solid var(--gold);
            color: var(--gold-dark);
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 2px;
            margin-bottom: 28px;
        }

        .hero-badge .star {
            color: var(--gold);
            font-size: 13px;
        }

        .hero-title {
            font-size: clamp(42px, 6vw, 78px);
            font-weight: 400;
            color: var(--dark);
            line-height: 1.1;
            margin-bottom: 12px;
            font-style: italic;
        }

        .hero-title .accent {
            color: var(--gold);
            font-style: italic;
        }

        .hero-subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gray-mid);
            margin-bottom: 24px;
        }

        .hero-description {
            font-size: 17px;
            color: var(--gray-dark);
            line-height: 1.8;
            margin-bottom: 44px;
            font-weight: 300;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--dark);
            color: var(--white);
            text-decoration: none;
            padding: 16px 36px;
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s;
            border: 2px solid var(--dark);
        }

        .btn-primary:hover {
            background: var(--gold);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 168, 76, 0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 16px 36px;
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s;
            border: 2px solid var(--dark);
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: var(--white);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin-top: 60px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .stat-item {
            background: var(--white);
            padding: 24px 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            font-style: italic;
            display: block;
        }

        .stat-label {
            font-family: 'Arial', sans-serif;
            font-size: 10px;
            color: var(--gray-mid);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        .hero-visual {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero-card-main {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .hero-card-header {
            background: linear-gradient(135deg, var(--dark) 0%, #3D3D3D 100%);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-card-header::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(201, 168, 76, 0.15);
        }

        .hero-card-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(201, 168, 76, 0.1);
        }

        .scissors-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .hero-card-header h3 {
            color: var(--white);
            font-size: 22px;
            font-style: italic;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        .hero-card-header p {
            color: var(--gold-light);
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .hero-card-body {
            padding: 28px;
        }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            color: var(--gray-dark);
        }

        .feature-list li .check {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            flex-shrink: 0;
        }

        .rating-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .rating-stars {
            display: flex;
            gap: 3px;
        }

        .rating-stars span {
            color: var(--gold);
            font-size: 20px;
        }
