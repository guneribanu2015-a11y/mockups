<head>
  <meta charset="UTF-8" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #b8960c;
      --gold-light: #d4af37;
      --gold-pale: #f5e9c0;
      --dark: #1a1a1a;
      --dark-soft: #2d2d2d;
      --gray-text: #555555;
      --light-gray: #f7f7f7;
      --white: #ffffff;
      --border: #e0d9cc;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Raleway', sans-serif;
      background-color: var(--white);
      color: var(--dark);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ===================== NAVBAR ===================== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      transition: box-shadow 0.3s ease;
    }

    nav.scrolled {
      box-shadow: 0 2px 20px var(--shadow);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .nav-logo {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .nav-logo-main {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: 0.5px;
    }

    .nav-logo-sub {
      font-family: 'Raleway', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark-soft);
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1.5px;
      background-color: var(--gold-light);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta a {
      display: inline-block;
      background-color: var(--gold-light);
      color: var(--white) !important;
      padding: 10px 22px;
      border-radius: 2px;
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .nav-cta a::after {
      display: none !important;
    }

    .nav-cta a:hover {
      background-color: var(--gold) !important;
      color: var(--white) !important;
      transform: translateY(-1px);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: var(--dark);
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .mobile-menu {
      display: none;
      background-color: var(--white);
      border-top: 1px solid var(--border);
      padding: 20px 24px 28px;
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mobile-menu ul a {
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark);
      transition: color 0.3s;
    }

    .mobile-menu ul a:hover {
      color: var(--gold);
    }

    .mobile-menu .mob-cta {
      margin-top: 20px;
    }

    .mobile-menu .mob-cta a {
      display: inline-block;
      background-color: var(--gold-light);
      color: var(--white);
      padding: 12px 28px;
      border-radius: 2px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .mobile-menu .mob-cta a:hover {
      background-color: var(--gold);
    }

    /* ===================== HERO ===================== */
    .hero {
      min-height: 100vh;
      background-color: var(--white);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding-top: 72px;
    }

    .hero-bg-pattern {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    .hero-lines {
      position: absolute;
      top: 0;
      right: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(135deg, var(--light-gray) 0%, #ece8e1 100%);
      clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%);
      pointer-events: none;
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--gold-pale);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    .hero-badge::before {
      content: '★';
      font-size: 0.85rem;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      font-weight: 700;
      color: var(--dark);
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .hero-title span {
      display: block;
      color: var(--gold-light);
      font-style: italic;
    }

    .hero-subtitle {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .hero-desc {
      font-size: 1rem;
      color: var(--gray-text);
      font-weight: 400;
      max-width: 460px;
      margin-bottom: 36px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-primary a {
      display: inline-block;
      background-color: var(--gold-light);
      color: var(--white);
      padding: 16px 36px;
      border-radius: 2px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
    }

    .btn-primary a:hover {
      background-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(212, 175, 55, 0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--dark);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-secondary svg {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      padding: 8px;
      transition: all 0.3s;
    }

    .btn-secondary:hover svg {
      border-color: var(--gold-light);
      background-color: var(--gold-pale);
    }

    .hero-stats {
      display: flex;
      gap: 36px;
      margin-top: 48px;
      padding-top: 36px;
      border-top: 1px solid var(--border);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--dark);
      line-height: 1;
    }

    .stat-num span {
      color: var(--gold-light);
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gray-text);
      margin-top: 4px;
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-card {
      background-color: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px 36px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
      position: relative;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 40px;
      right: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-light), var(--gold));
      border-radius: 0 0 3px 3px;
    }

    .card-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--gold-pale), rgba(212, 175, 55, 0.15));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 6px;
    }
