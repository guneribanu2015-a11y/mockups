<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuaför Önder Toprak – Kadıköy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --dark: #0d0d0d;
    --dark2: #1a1a1a;
    --dark3: #252525;
    --cream: #f8f4ef;
    --text-muted: #888;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--dark);
    color: var(--white);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 6%;
    background: rgba(13,13,13,0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    transition: all .3s;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: #ccc;
    text-decoration: none;
    font-size: .875rem;
    font-weight: 500;
    letter-spacing: .5px;
    transition: color .3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: var(--gold);
    color: var(--dark) !important;
    padding: .5rem 1.4rem;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: background .3s, transform .2s !important;
  }

  .nav-cta:hover { background: var(--gold-light) !important; transform: translateY(-1px); }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all .3s;
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding: 0 6%;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(201,169,110,0.12) 0%, transparent 70%),
      linear-gradient(135deg, #0d0d0d 0%, #1a1209 50%, #0d0d0d 100%);
  }

  .hero-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .hero-circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.1);
  }
  .hero-circle:nth-child(1) { width: 600px; height: 600px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .hero-circle:nth-child(2) { width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .hero-circle:nth-child(3) { width: 1200px; height: 1200px; top: 50%; left: 50%; transform: translate(-50%,-50%); }

  .hero-content { position: relative; z-index: 2; max-width: 800px; }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    background: rgba(201,169,110,0.12);
    border: 1px solid rgba(201,169,110,0.3);
    color: var(--gold);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: .45rem 1.2rem;
    border-radius: 50px;
    margin-bottom: 2rem;
  }

  .hero-badge::before { content: '✦'; font-size: .7rem; }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 1.5rem;
    color: var(--white);
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--gold) 0%, #f0d898 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(.95rem, 2vw, 1.15rem);
    color: #aaa;
    font-weight: 300;
    line-height: 1.8;
    margin-bottom: 2.5rem;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-bottom: 3rem;
    font-size: .875rem;
    color: var(--text-muted);
  }

  .stars { color: var(--gold); letter-spacing: 2px; }

  .hero-stars strong { color: var(--white); }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: linear-gradient(135deg, var(--gold), #a8823d);
    color: var(--dark);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    padding: 1.1rem 2.8rem;
    border-radius: 50px;
    letter-spacing: .5px;
    box-shadow: 0 8px 40px rgba(201,169,110,0.35);
    transition: all .3s;
    border: none;
    cursor: pointer;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 50px rgba(201,169,110,0.5);
  }

  .btn-primary svg { width: 18px; height: 18px; }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: transparent;
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    padding: 1.05rem 2.2rem;
    border-radius: 50px;
    border: 1.5px solid rgba(201,169,110,0.4);
    transition: all .3s;
  }

  .btn-outline:hover {
    background: rgba(201,169,110,0.08);
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .hero-ctas {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .hero-scroll {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    color: var(--text-muted);
    font-size: .7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: bounce 2s infinite;
    z-index: 2;
  }

  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }

  /* ── SECTION COMMON ── */
  section { padding: 6rem 6%; }

  .section-label {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    color: var(--gold);
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .section-label::before, .section-label::after {
    content: '';
    width: 30px; height: 1px;
    background: var(--gold);
    opacity: .5;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    color: var(--white);
    margin-bottom: 1rem;
  }

  .section-desc {
    color: var(--text-muted);
    font-size: .95rem;
    line-height: 1.8;
    max-width: 520px;
  }

  /* ── SERVICES ── */
  #hizmetler {
    background: var(--dark2);
    position: relative;
    overflow: hidden;
  }

  #hizmetler::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .services-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .services-header .section-label {
    justify-content: center;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .service-card {
    background: var(--dark3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 2rem;
    transition: all .4s;
    cursor: default;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: scaleX(0);
    transition: transform .4s;
  }

  .service-card:hover {
    transform: translateY(-6px);
    border-color: rgba(201,169,110,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .service-card:hover::before { transform: scaleX(1); }

  .service-icon {
    width: 52px; height: 52px;
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 1.25rem;
    transition: all .4s;
  }

  .service-card:hover .service-icon {
    background: rgba(201,169,110,0.18);
    border-color: rgba(201,169,110,0.4);
  }

  .service-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: .6rem;
  }

  .service-desc {
    font-size: .875rem;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .service-tag {
    display: inline-block;
    margin-top: .9rem;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(201,169,110,0.08);
    padding: .25rem .75rem;
    border-radius: 50px;
  }

  /* ── WHY ── */
  #neden {
    background: var(--dark);
  }

  .why-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }

  .why-visual {
    position: relative;
  }

  .why-card-main {
    background: var(--dark3);
    border: 1px solid rgba(201,169,110,0.15);
    border-radius: 20px;
    padding: 3rem;
    position:
