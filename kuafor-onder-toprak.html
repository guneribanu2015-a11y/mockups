<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaför Önder Toprak | Kadıköy İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --accent: #c9a84c;
            --accent-light: #e8c97a;
            --bg: #f8f8f6;
            --bg-section: #ffffff;
            --text-dark: #1a1a1a;
            --text-gray: #555555;
            --text-light: #888888;
            --border: #e8e8e8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* ---- NAV ---- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-logo-text {
            display: flex;
            flex-direction: column;
        }

        .nav-logo-text span:first-child {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.3px;
        }

        .nav-logo-text span:last-child {
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            letter-spacing: 0.3px;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff !important;
            padding: 9px 20px;
            border-radius: 8px;
            font-weight: 600 !important;
            transition: transform 0.2s, box-shadow 0.2s !important;
            color: var(--primary) !important;
        }

        .nav-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(201,168,76,0.4);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 5px;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 68px;
            left: 0;
            right: 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 20px 5%;
            z-index: 999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 12px 0;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu a:last-child {
            border-bottom: none;
            color: var(--accent);
            font-weight: 600;
        }

        /* ---- HERO ---- */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #f9f5ee 0%, #fff8ed 40%, #f0ede6 100%);
            display: flex;
            align-items: center;
            padding: 0 5%;
            padding-top: 68px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201,168,76,0.1);
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 13px;
            color: #b8860b;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .hero-badge span {
            font-size: 16px;
        }

        .hero-title {
            font-size: clamp(36px, 5vw, 58px);
            font-weight: 800;
            color: var(--primary);
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-title .highlight {
            color: var(--accent);
            position: relative;
        }

        .hero-subtitle {
            font-size: 17px;
            color: var(--text-gray);
            margin-bottom: 36px;
            line-height: 1.7;
            max-width: 480px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--accent), #b8860b);
            color: #fff;
            padding: 15px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(201,168,76,0.35);
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201,168,76,0.5);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: var(--primary);
            padding: 15px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            gap: 32px;
            margin-top: 44px;
            padding-top: 32px;
            border-top: 1px solid rgba(201,168,76,0.2);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--accent), transparent, var(--accent-light));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.3;
        }

        .hero-card-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 24px;
        }

        .hero-card h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .hero-card p {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 24px;
        }

        .rating-display {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #fafafa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .rating-score {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .rating-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stars {
            color: #f59e0b;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .rating-count {
            font-size: 12px;
            color: var(--text-light);
        }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .feature-list li::before {
            content: '✓';
            width: 22px;
            height: 22px;
            background: rgba(201,168,76,0.15);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ---- SECTION HEADER ---- */
        .section-header {
            text-align: center;
            margin-bottom: 56px;
        }

        .section-tag {
            display: inline-block;
            background: rgba(201,168,76,0.1);
            color: #b8860b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .section-desc {
            font-size: 16px;
            color: var(--text-gray);
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ---- SERVICES ---- */
        .services {
            padding: 100px 5%;
            background: var(--bg-section);
        }

        .services-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .service-card {
            background: var(--bg);
            border-radius: 20px;
