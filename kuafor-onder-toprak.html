<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaför Önder Toprak - Kadıköy İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-dark: #a07830;
            --dark: #1a1a1a;
            --dark-gray: #333333;
            --medium-gray: #666666;
            --light-gray: #f5f5f5;
            --white: #ffffff;
            --border: #e0e0e0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.6;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transition: box-shadow 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .nav-logo span:first-child {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            letter-spacing: 1px;
        }

        .nav-logo span:last-child {
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-style: italic;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 36px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark-gray);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background-color: var(--gold);
            color: var(--white) !important;
            padding: 10px 24px;
            border-radius: 2px;
            font-size: 13px !important;
            letter-spacing: 1.5px !important;
            transition: background-color 0.3s ease !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background-color: var(--gold-dark) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--dark);
            transition: all 0.3s ease;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            padding: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .mobile-menu ul li a {
            display: block;
            padding: 14px 24px;
            text-decoration: none;
            color: var(--dark-gray);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            transition: color 0.3s ease;
            text-align: center;
        }

        .mobile-menu ul li a:hover {
            color: var(--gold);
        }

        .mobile-menu .mobile-cta {
            display: block;
            margin: 16px 24px 0;
            background-color: var(--gold);
            color: var(--white);
            padding: 14px 24px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .mobile-menu .mobile-cta:hover {
            background-color: var(--gold-dark);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdfcfa 0%, #f7f3ed 50%, #fdfcfa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(201, 168, 76, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201, 168, 76, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 60% 80%, rgba(201, 168, 76, 0.05) 0%, transparent 40%);
        }

        .hero-decoration-left {
            position: absolute;
            left: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: linear-gradient(to right, rgba(201,168,76,0.04), transparent);
        }

        .hero-decoration-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: linear-gradient(to left, rgba(201,168,76,0.04), transparent);
        }

        .hero-content {
            text-align: center;
            z-index: 1;
            max-width: 800px;
            padding: 40px 24px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(201, 168, 76, 0.1);
            border: 1px solid rgba(201, 168, 76, 0.3);
            color: var(--gold-dark);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            margin-bottom: 30px;
        }

        .hero-badge::before {
            content: '✦';
            font-size: 10px;
        }

        .hero-badge::after {
            content: '✦';
            font-size: 10px;
        }

        .hero-title {
            font-size: clamp(40px, 7vw, 80px);
            font-weight: normal;
            color: var(--dark);
            line-height: 1.1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .hero-title span {
            color: var(--gold);
            font-style: italic;
        }

        .hero-subtitle-name {
            font-size: clamp(16px, 3vw, 22px);
            color: var(--dark-gray);
            font-family: 'Arial', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 24px auto;
        }

        .hero-divider::before,
        .hero-divider::after {
            content: '';
            display: block;
            height: 1px;
            width: 80px;
            background: linear-gradient(to right, transparent, var(--gold));
        }

        .hero-divider::after {
            background: linear-gradient(to left, transparent, var(--gold));
        }

        .hero-divider span {
            color: var(--gold);
            font-size: 16px;
        }

        .hero-description {
            font-size: 16px;
            color: var(--medium-gray);
            max-width: 500px;
            margin: 0 auto 40px;
            font-family: 'Arial', sans-serif;
            line-height: 1.8;
        }

        .hero-stars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
        }

        .stars {
            display: flex;
            gap: 3px;
        }

        .stars span {
            color: var(--gold);
            font-size: 18px;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            color: var(--medium-gray);
            letter-spacing: 0.5px;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--gold);
            color: var(--white);
            text-decoration: none;
            padding: 16px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--gold-dark);
            box-shadow: 0 6px 30px rgba(201, 168, 76, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            display: inline-block;
            background-color: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 16px 40px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            border-radius: 2px;
            border: 1px solid var(--dark);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: var(--dark);
            color: var(--white);
            transform: translateY(-2px);
        }

        .hero-scroll {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounce 2s infinite;
        }

        .hero-scroll span {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--medium-gray);
        }

        .hero-scroll svg {
            width: 20px;
            height: 20px;
            color: var(--gold);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-8px); }
            60% { transform: translateX(-50%) translateY(-4px); }
        }

        /* SECTION COMMON */
        section {
            padding: 100px 24px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-label {
            display: inline-block;
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: normal;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .section-title em {
            font-style: italic;
            color: var(--gold);
        }

        .section-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .section-line::before,
        .section-line::after {
            content: '';
            display: block;
            height: 1px;
            width: 60px;
            background-color: var(--border);
        }

        .section-line span {
            color: var(--
