<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaför Önder Toprak | Kadıköy İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --accent: #c9a96e;
            --accent-light: #e8d5b0;
            --text-dark: #1a1a2e;
            --text-mid: #4a4a6a;
            --text-light: #7a7a9a;
            --bg-white: #ffffff;
            --bg-light: #f8f7f4;
            --bg-cream: #faf9f6;
            --border: #e8e5df;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), #a07840);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .nav-logo-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            font-family: 'Georgia', serif;
        }

        .nav-logo-text span {
            display: block;
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-mid);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--accent), #a07840);
            color: white !important;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(201, 169, 110, 0.3);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 169, 110, 0.5);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--text-dark);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        /* MOBILE MENU */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: white;
            padding: 30px 5%;
            border-bottom: 1px solid var(--border);
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
        }

        .mobile-menu .mob-cta {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), #a07840);
            color: white !important;
            padding: 14px 30px;
            border-radius: 30px;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f0e8 50%, #ede8df 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 70px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--accent-light);
            padding: 8px 18px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-size: 0.8rem;
            color: var(--accent);
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(201,169,110,0.15);
        }

        .hero-badge::before {
            content: '✦';
            font-size: 10px;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1.1;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        .hero-title .accent-text {
            color: var(--accent);
            font-style: italic;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-mid);
            line-height: 1.8;
            margin-bottom: 35px;
            font-family: 'Arial', sans-serif;
            font-weight: 400;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .stars {
            display: flex;
            gap: 3px;
        }

        .star {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .star.half {
            position: relative;
            color: #ddd;
        }

        .star.half::before {
            content: '★';
            position: absolute;
            color: var(--accent);
            clip-path: inset(0 50% 0 0);
        }

        .rating-text {
            font-size: 0.9rem;
            color: var(--text-mid);
            font-family: 'Arial', sans-serif;
        }

        .rating-text strong {
            color: var(--text-dark);
            font-size: 1.1rem;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--accent), #a07840);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Arial', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(201, 169, 110, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(201, 169, 110, 0.5);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            color: var(--text-dark);
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-card-main {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
        }

        .hero-card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .hero-card-title {
            font-size: 1.4rem;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 8px;
            font-family: 'Georgia', serif;
        }

        .hero-card-sub {
            color: var(--text-light);
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Arial', sans-serif;
            margin-bottom: 25px;
        }

        .hero-card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Georgia', serif;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            margin-top: 4px;
        }

        .floating-badge {
            position: absolute;
            background: white;
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid var(--border);
            font-family: 'Arial', sans-serif;
            animation: float 3s ease-in-out infinite;
        }

        .floating-badge-1 {
            top: -20px;
            right: -20px;
            animation-delay: 0s;
        }

        .floating-badge-2 {
            bottom: 30px;
            left: -30px;
            animation-delay: 1.5s;
        }

        .floating-badge .fb-icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .floating-badge .fb-text {
            font-size: 0.7rem;
            color: var(--text-mid);
            white-space: nowrap;
            font-weight: 600;
        }

        .floating-badge .fb-sub {
            font-size: 0.65rem;
            color: var(--text-light);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* DECORATIVE LINE */
        .section-header {
