<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Bayan Kuaförü - Kadıköy, İstanbul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97e;
            --gold-dark: #a07830;
            --rose: #d4a0a0;
            --rose-light: #f5e8e8;
            --dark: #2c2c2c;
            --medium: #555555;
            --light: #888888;
            --white: #ffffff;
            --bg: #fafaf8;
            --bg2: #f4f0eb;
            --border: #e8e0d5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .nav-logo-text {
            display: flex;
            flex-direction: column;
        }

        .nav-logo-main {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .nav-logo-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--medium);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--gold);
            transition: width 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: white !important;
            padding: 10px 22px;
            border-radius: 30px;
            letter-spacing: 1px !important;
            transition: all 0.3s !important;
            box-shadow: 0 4px 15px rgba(201,168,76,0.3);
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201,168,76,0.4) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--dark);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 72px;
            left: 0;
            width: 100%;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px 28px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mobile-menu ul li a {
            display: block;
            padding: 12px 0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--medium);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            transition: color 0.3s;
        }

        .mobile-menu ul li a:hover {
            color: var(--gold-dark);
        }

        .mobile-menu ul li:last-child a {
            border-bottom: none;
            color: var(--gold-dark);
            font-weight: 600;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #fff8f0 0%, #fdf5ee 40%, #f8efe8 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 72px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -150px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,160,160,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-decorative-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.15), transparent);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            animation: fadeInLeft 1s ease forwards;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-dark);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .hero-badge-dot {
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(42px, 5vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .hero-title em {
            font-style: italic;
            color: var(--gold-dark);
            display: block;
        }

        .hero-subtitle {
            font-size: 16px;
            font-weight: 300;
            color: var(--medium);
            line-height: 1.8;
            margin-bottom: 36px;
            max-width: 460px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: white;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 30px rgba(201,168,76,0.35);
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(201,168,76,0.45);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold-dark);
            background: rgba(201,168,76,0.04);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
        }

        .hero-stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1;
        }

        .hero-stat-label {
            font-size: 12px;
            font-weight: 400;
            color: var(--light);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .hero-stat-stars {
            display: flex;
            gap: 2px;
            margin-top: 4px;
        }

        .hero-stat-stars span {
            color: var(--gold);
            font-size: 14px;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: fadeInRight 1s ease forwards;
        }

        .hero-card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.08), 0 0 0 1px rgba(201,168,76,0.1);
            position: relative;
            max-width: 380px;
            width: 100%;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 40px;
            right: 40px;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            border-radius: 0 0 3px 3px;
        }

        .hero-card-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 28px;
        }

        .hero-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .
