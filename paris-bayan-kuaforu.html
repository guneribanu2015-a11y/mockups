<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris Bayan Kuaförü - Kadıköy İstanbul</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --rose: #c9748f;
    --rose-dark: #a85a74;
    --rose-light: #f5e6eb;
    --gold: #d4a853;
    --dark: #2c2c2c;
    --gray: #666;
    --light-gray: #f8f8f8;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Georgia', serif;
    background: var(--white);
    color: var(--dark);
    line-height: 1.7;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    z-index: 1000;
    padding: 0 20px;
    border-bottom: 1px solid #f0e0e6;
    box-shadow: 0 2px 20px rgba(201,116,143,0.1);
  }

  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }

  .nav-logo {
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--rose);
    letter-spacing: 1px;
    text-decoration: none;
  }

  .nav-logo span {
    color: var(--gold);
  }

  .nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--dark);
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    transition: color 0.3s;
    font-family: 'Arial', sans-serif;
  }

  .nav-links a:hover { color: var(--rose); }

  .nav-cta {
    background: var(--rose);
    color: var(--white) !important;
    padding: 9px 22px;
    border-radius: 25px;
    font-size: 0.85rem !important;
    transition: background 0.3s !important;
  }

  .nav-cta:hover { background: var(--rose-dark) !important; color: var(--white) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .hamburger span {
    width: 25px; height: 2px;
    background: var(--rose);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff5f8 0%, #fce8ef 40%, #f8f0f5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 20px 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,116,143,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(212,168,83,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-content { position: relative; z-index: 1; max-width: 750px; }

  .hero-badge {
    display: inline-block;
    background: var(--rose-light);
    color: var(--rose-dark);
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 0.82rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 25px;
    font-family: 'Arial', sans-serif;
    border: 1px solid rgba(201,116,143,0.2);
  }

  .hero h1 {
    font-size: clamp(2.2rem, 6vw, 4rem);
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 10px;
    font-weight: normal;
  }

  .hero h1 em {
    color: var(--rose);
    font-style: italic;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: var(--rose);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  .hero p {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--gray);
    max-width: 560px;
    margin: 0 auto 40px;
    font-family: 'Arial', sans-serif;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 35px;
  }

  .stars-icon { color: var(--gold); font-size: 1.2rem; letter-spacing: 3px; }

  .stars-text {
    color: var(--gray);
    font-family: 'Arial', sans-serif;
    font-size: 0.88rem;
  }

  .stars-text strong { color: var(--dark); }

  .hero-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    color: var(--white);
    padding: 16px 38px;
    border-radius: 50px;
    text-decoration: none;
    font-family: 'Arial', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(201,116,143,0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(201,116,143,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--rose);
    padding: 15px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-family: 'Arial', sans-serif;
    font-size: 1rem;
    border: 2px solid var(--rose);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    background: var(--rose);
    color: var(--white);
    transform: translateY(-3px);
  }

  .hero-decor {
    position: absolute;
    font-size: 8rem;
    opacity: 0.04;
    color: var(--rose);
    user-select: none;
  }

  .hero-decor-1 { top: 10%; left: 5%; }
  .hero-decor-2 { bottom: 15%; right: 5%; font-size: 6rem; }

  /* STATS */
  .stats {
    background: var(--white);
    padding: 60px 20px;
    border-top: 1px solid #f0e0e6;
    border-bottom: 1px solid #f0e0e6;
  }

  .stats-inner {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 30px;
    text-align: center;
  }

  .stat-item {}

  .stat-number {
    font-size: 2.5rem;
    color: var(--rose);
    font-weight: bold;
    display: block;
    line-height: 1;
    margin-bottom: 8px;
  }

  .stat-label {
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* SECTION COMMON */
  section { padding: 90px 20px; }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    color: var(--rose);
    font-family: 'Arial', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: var(--dark);
    font-weight: normal;
    margin-bottom: 15px;
  }

  .section-header h2 em { color: var(--rose); font-style: italic; }

  .section-header p {
    font-family: 'Arial', sans-serif;
    color: var(--gray);
    max-width: 520px;
    margin: 0 auto;
    font-size: 0.97rem;
  }

  .divider {
    width: 50px; height: 2px;
    background: linear-gradient(90deg, var(--rose), var(--gold));
    margin: 20px auto 0;
    border-radius: 2px;
  }

  /* SERVICES */
  .services { background: var(--light-gray); }

  .services-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
  }

  .service-card {
    background: var(--white);
    border-radius: 16px;
    padding: 35px 30px;
    transition: all 0.3s;
    border: 1px solid #f0e0e6;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--rose), var(--gold));
    border-radius: 4px 0 0 4px;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(201,116,143,0.15);
    border-color: rgba(201,116,143,0.3);
  }

  .service-icon {
    font-size: 2.2rem;
    margin-bottom: 18px;
    display: block;
  }

  .service-card h3 {
    font-size: 1.2rem;
    color: var(--dark);
    margin-bottom: 12px;
    font-weight: bold;
  }

  .service-card p {
    font-family: 'Arial', sans-serif;
    color: var(--gray);
    font-size: 0.9rem;
    margin-bottom: 18px;
    line-height: 1.6;
  }

  .service-items {
    list-style: none;
  }

  .service-items li {
    font-family: 'Arial', sans-serif;
    font-size: 0.87rem;
    color: var(--dark);
    padding: 5px 0;
    border-bottom: 1px dashed #f0e0e6;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .service-items li:last-child { border-bottom: none; }

  .service-items li::before {
    content: '✦';
    color: var(--rose);
    font-size: 0.6rem;
    flex-shrink: 0;
  }

  /* FEATURES */
  .features { background: var(--white); }

  .features-grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 35px;
    text-align: center;
  }

  .feature-item {}

  .feature-circle {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--rose-light), #fce8ef);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 18px;
    border: 2px solid rgba(201,116,143,0.15);
  }

  .feature-item h4 {
    color: var(--dark);
    margin-bottom: 8px;
    font-size: 1rem;
  }

  .feature-item p {
    font-family: 'Arial', sans-serif;
    color: var(--gray);
    font-size: 0.85rem;
  }

  /* TESTIMONIALS */
  .testimonials { background: linear-gradient(135deg, #fff5f8, #fce8ef); }

  .testimonials-grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
  }

  .testimonial-card {
    background: var(--white);
    border-radius
