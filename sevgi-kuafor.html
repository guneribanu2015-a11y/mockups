<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgi Kuaför - Kadıköy İstanbul</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --dark: #1a1a2e;
    --dark-soft: #2d2d44;
    --text: #2c2c2c;
    --text-light: #666;
    --white: #ffffff;
    --light-bg: #fafaf8;
    --section-bg: #f5f3ef;
    --border: #e8e0d0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background-color: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAVIGATION */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .nav-logo-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-logo-sub {
    font-size: 0.65rem;
    color: var(--gold-dark);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
    transition: color 0.3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.3s;
  }

  .nav-links a:hover {
    color: var(--gold-dark);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--gold) !important;
    color: var(--white) !important;
    padding: 10px 22px !important;
    border-radius: 2px;
    font-weight: 600 !important;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    background: var(--gold-dark) !important;
    color: var(--white) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    padding: 5px;
  }

  .hamburger span {
    display: block;
    width: 25px;
    height: 2px;
    background: var(--dark);
    transition: all 0.3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    background: var(--white);
    border-bottom: 2px solid var(--gold-light);
    padding: 20px 5%;
    z-index: 999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  .mobile-menu.open {
    display: block;
  }

  .mobile-menu ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .mobile-menu a {
    text-decoration: none;
    color: var(--text);
    font-family: 'Arial', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
    display: block;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s;
  }

  .mobile-menu a:hover {
    color: var(--gold-dark);
  }

  .mobile-menu a.mobile-cta {
    background: var(--gold);
    color: var(--white);
    text-align: center;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 2px;
    font-weight: 600;
  }

  /* HERO SECTION */
  .hero {
    min-height: 100vh;
    padding-top: 70px;
    background: linear-gradient(135deg, #fefefe 0%, #f9f5ef 40%, #f2ead8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-decoration-left {
    position: absolute;
    left: 5%;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.07;
    font-size: 20rem;
    color: var(--gold);
    font-family: 'Georgia', serif;
    pointer-events: none;
    line-height: 1;
    user-select: none;
  }

  .hero-decoration-right {
    position: absolute;
    right: 3%;
    top: 20%;
    opacity: 0.05;
    font-size: 15rem;
    color: var(--gold);
    font-family: 'Georgia', serif;
    pointer-events: none;
    user-select: none;
  }

  .hero-content {
    text-align: center;
    z-index: 1;
    padding: 60px 20px;
    max-width: 800px;
    animation: fadeInUp 1s ease forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero-badge {
    display: inline-block;
    font-family: 'Arial', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-dark);
    border: 1px solid var(--gold);
    padding: 8px 20px;
    margin-bottom: 25px;
    background: rgba(201, 169, 110, 0.08);
  }

  .hero-title {
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 15px;
    font-weight: 400;
    letter-spacing: 3px;
  }

  .hero-title span {
    color: var(--gold-dark);
    font-style: italic;
  }

  .hero-subtitle {
    font-family: 'Arial', sans-serif;
    font-size: clamp(0.85rem, 2vw, 1rem);
    letter-spacing: 2px;
    color: var(--text-light);
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .hero-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px auto;
    max-width: 300px;
  }

  .hero-divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .hero-divider-line:last-child {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .hero-divider-icon {
    color: var(--gold);
    font-size: 1.2rem;
  }

  .hero-description {
    font-family: 'Arial', sans-serif;
    font-size: 1rem;
    color: var(--text-light);
    line-height: 1.8;
    max-width: 550px;
    margin: 0 auto 35px;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 35px;
  }

  .stars {
    display: flex;
    gap: 3px;
  }

  .star {
    color: var(--gold);
    font-size: 1.1rem;
  }

  .star.half {
    position: relative;
    color: #ddd;
  }

  .star.half::before {
    content: '★';
    position: absolute;
    left: 0;
    color: var(--gold);
    clip-path: inset(0 50% 0 0);
  }

  .rating-text {
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    color: var(--text-light);
    letter-spacing: 1px;
  }

  .rating-score {
    font-weight: 700;
    color: var(--text);
    font-size: 1rem;
  }

  .hero-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: var(--dark);
    color: var(--white);
    padding: 16px 40px;
    text-decoration: none;
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    border-radius: 2px;
    transition: all 0.3s;
    display: inline-block;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: var(--gold);
    transition: left 0.3s;
    z-index: 0;
  }

  .btn-primary:hover::before {
    left: 0;
  }

  .btn-primary span {
    position: relative;
    z-index: 1;
  }

  .btn-secondary {
    background: transparent;
    color: var(--dark);
    padding: 15px 35px;
    text-decoration: none;
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1.5px solid var(--dark);
    border-radius: 2px;
    transition: all 0.3s;
    display: inline-block;
  }

  .btn-secondary:hover {
    background: var(--dark);
    color: var(--white);
  }

  .hero-scroll {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: bounce 2s infinite;
  }

  .hero-scroll span {
    font-family: 'Arial', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--gold-dark);
    text-transform: uppercase;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* FEATURES STRIP */
  .features-strip {
    background: var(--dark);
    padding: 30px 5%;
  }

  .features-grid {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--white);
  }

  .feature-icon {
    font-size: 1.5rem;
    color: var(--gold);
  }

  .feature-text strong {
    display: block;
    font-family: 'Arial', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 2px;
  }

  .feature-text span {
    font
