<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi Kuaför - Kadıköy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c9956a;
            --primary-dark: #b07d54;
            --primary-light: #f5e6d8;
            --accent: #8b5e52;
            --text-dark: #2c2c2c;
            --text-medium: #555555;
            --text-light: #888888;
            --white: #ffffff;
            --bg-light: #fafaf8;
            --bg-section: #f7f3ef;
            --border: #e8ddd5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--white);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-medium);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            font-family: 'Arial', sans-serif;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-cta {
            background: var(--primary);
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: bold !important;
            transition: background 0.3s !important;
        }

        .nav-cta:hover {
            background: var(--primary-dark) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--text-dark);
            border-radius: 2px;
            transition: 0.3s;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf6f0 0%, #f5ebe0 40%, #ede0d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201, 149, 106, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 94, 82, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 750px;
        }

        .hero-badge {
            display: inline-block;
            background: var(--white);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-family: 'Arial', sans-serif;
            box-shadow: 0 2px 15px rgba(201, 149, 106, 0.2);
        }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 5rem);
            color: var(--accent);
            line-height: 1.15;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--primary);
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--text-medium);
            margin-bottom: 15px;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .stars {
            color: #f4b942;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
            color: var(--text-medium);
            font-size: 0.9rem;
        }

        .rating-text strong {
            color: var(--text-dark);
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: var(--white);
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1rem;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(201, 149, 106, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(201, 149, 106, 0.5);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--accent);
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1rem;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 2px solid var(--accent);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: var(--white);
            transform: translateY(-2px);
        }

        .hero-scroll {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        .hero-scroll span {
            display: block;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, var(--primary), transparent);
            margin: 0 auto;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* FEATURES STRIP */
        .features-strip {
            background: var(--white);
            padding: 40px 20px;
            border-bottom: 1px solid var(--border);
        }

        .features-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .feature-item h4 {
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .feature-item p {
            font-family: 'Arial', sans-serif;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* SECTION COMMON */
        section {
            padding: 90px 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            color: var(--primary);
            font-family: 'Arial', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--accent);
            font-weight: normal;
            margin-bottom: 15px;
        }

        .section-header p {
            font-family: 'Arial', sans-serif;
            color: var(--text-medium);
            font-size: 1rem;
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* SERVICES */
        .services {
            background: var(--bg-section);
        }

        .services-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: var(--white);
            border-radius: 16px;
            padding: 35px 30px;
            border: 1px solid var(--border);
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            transition: height 0.35s;
            border-radius: 0 0 4px 0;
        }

        .service-card:hover::before {
            height: 100%;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 94, 82, 0.12);
            border-color: var(--primary-light);
        }

        .service-icon {
            font-size: 2.2rem;
            margin-bottom: 15px;
            display: block;
        }

        .service-card h3 {
            font-size: 1.15rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .service-card p {
            font-family: 'Arial', sans-serif;
            font-size: 0.88rem;
            color: var(--text-medium);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .service-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .service-items li {
            font-family: 'Arial', sans-serif;
            font-size: 0.85rem;
            color: var(--text-medium);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-items li::before {
            content: '✦';
            color: var(--primary);
            font-size: 0.6rem;
            flex-shrink: 0;
        }

        /* GALLERY / WHY US */
        .why-us {
            background: var(--white);
        }

        .why-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 30px;
        }

        .why-card {
            text-align: center;
            padding: 40px 25px;
            background: var(--bg-section);
            border-radius: 16px;
            transition: all 0.3s;
        }

        .why-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(201, 149, 106, 0.15);
        }

        .why-number {
            font-size: 3rem;
            color: var(--primary-light);
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1;
        }

            font-size: 1.05rem;
            color: var(--accent);
            margin-bottom:
