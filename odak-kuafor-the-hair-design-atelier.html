<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Kuaför – The Hair Design Atelier</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #b8965a;
    --gold-light: #d4af7a;
    --dark: #1a1a1a;
    --mid: #444;
    --light: #777;
    --bg: #fafaf8;
    --bg2: #f3f1ed;
    --white: #ffffff;
    --border: #e8e4dc;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-logo span:first-child {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--dark);
    text-transform: uppercase;
  }

  .nav-logo span:last-child {
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mid);
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: var(--gold);
    color: var(--white) !important;
    padding: 0.5rem 1.2rem;
    border-radius: 2px;
    font-size: 0.72rem !important;
    letter-spacing: 0.18em !important;
    text-decoration: none;
    text-transform: uppercase;
    transition: background 0.3s !important;
  }

  .nav-cta:hover { background: var(--gold-light) !important; color: var(--white) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    width: 24px; height: 2px;
    background: var(--dark);
    display: block;
    transition: all 0.3s;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdfcf9 0%, #f5f0e8 40%, #ede5d4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 2rem 4rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,150,90,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,150,90,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner { max-width: 780px; position: relative; z-index: 1; }

  .hero-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }

  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    width: 40px; height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .hero h1 {
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    font-weight: 400;
    line-height: 1.15;
    color: var(--dark);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-sub {
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--light);
    margin-bottom: 1.8rem;
  }

  .hero-desc {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--mid);
    max-width: 540px;
    margin: 0 auto 2.5rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3.5rem;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--dark);
    color: var(--white);
    text-decoration: none;
    padding: 1rem 2.2rem;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .btn-primary:hover {
    background: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(184,150,90,0.3);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: transparent;
    color: var(--dark);
    text-decoration: none;
    padding: 1rem 2.2rem;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    border: 1px solid var(--dark);
    transition: all 0.3s;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .btn-secondary:hover {
    background: var(--dark);
    color: var(--white);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 3rem;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 2.5rem;
    border-top: 1px solid var(--border);
  }

  .stat { text-align: center; }

  .stat-number {
    font-size: 2rem;
    font-weight: 300;
    color: var(--dark);
    display: block;
    line-height: 1;
    margin-bottom: 0.3rem;
  }

  .stat-number span { color: var(--gold); }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--light);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* RATING BADGE */
  .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 0.5rem 1.2rem;
    margin-bottom: 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .stars { color: #f5a623; font-size: 0.85rem; letter-spacing: 2px; }

  .rating-text {
    font-size: 0.72rem;
    color: var(--mid);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.05em;
  }

  /* SECTIONS */
  section { padding: 5rem 2rem; }

  .section-header {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 4rem;
  }

  .section-eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
  }

  .section-eyebrow::before,
  .section-eyebrow::after {
    content: '';
    width: 30px; height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .section-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 400;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 1rem;
  }

  .section-header p {
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--light);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
  }

  /* SERVICES */
  #hizmetler { background: var(--white); }

  .services-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2px;
  }

  .service-category {
    background: var(--bg);
    padding: 2.5rem 2rem;
    border: 1px solid var(--border);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .service-category::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 0;
    background: var(--gold);
    transition: height 0.4s;
  }

  .service-category:hover::before { height: 100%; }
  .service-category:hover { background: var(--white); box-shadow: 0 10px 40px rgba(0,0,0,0.06); }

  .service-icon {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .service-category h3 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dark);
    margin-bottom: 0.5rem;
  }

  .service-category .cat-desc {
    font-size: 0.8rem;
    color: var(--light);
    margin-bottom: 1.5rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }

  .service-list { list-style: none; }

  .service-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .service-list li:last-child { border-bottom: none; }

  .service-list .name { color: var(--mid); }

  .service-list .price {
    color: var(--gold);
    font-weight: 600;
    font-size: 0.8rem;
    white-space: nowrap;
    margin-left: 1rem;
  }

  /* WHY US */
  #neden-biz { background: var(--bg2); }

  .features-grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 2rem;
  }

  .feature-card {
    text-align: center;
    padding: 2rem 1.5rem;
  }

  .feature-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--white);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1.2rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }

  .feature-card h3 {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dark);
    margin-bottom: 0.7rem;
  }

  .feature-card p {
    font-size: 0.82
