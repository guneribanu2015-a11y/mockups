<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odak Kuaför - The Hair Design Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #b8965a;
            --gold-light: #d4af7a;
            --gold-dark: #8a6e3e;
            --white: #ffffff;
            --off-white: #fafaf8;
            --light-gray: #f4f2ef;
            --mid-gray: #e8e4de;
            --dark: #1a1a1a;
            --dark-mid: #2d2d2d;
            --text-gray: #5a5a5a;
            --text-light: #8a8a8a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--off-white);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-gray);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 3px;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 0 40px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(184, 150, 90, 0.2);
            transition: all 0.4s ease;
        }

        nav.scrolled {
            height: 65px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .nav-logo .logo-main {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-logo .logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dark-mid);
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--gold);
            color: var(--white) !important;
            padding: 10px 24px !important;
            border-radius: 0 !important;
            transition: background 0.3s ease !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background: var(--gold-dark) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            background: none;
            border: none;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 1.5px;
            background: var(--dark);
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(6.5px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-6.5px) rotate(-45deg);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 30px 40px;
            border-bottom: 1px solid var(--mid-gray);
            z-index: 999;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .mobile-menu.open {
            transform: translateY(0);
            opacity: 1;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-menu a {
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dark);
            transition: color 0.3s;
        }

        .mobile-menu a:hover {
            color: var(--gold);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--off-white);
            overflow: hidden;
            padding: 80px 40px 0;
        }

        .hero-bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(184, 150, 90, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(184, 150, 90, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 60% 80%, rgba(184, 150, 90, 0.04) 0%, transparent 40%);
        }

        .hero-lines {
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            opacity: 0.04;
            background-image: repeating-linear-gradient(
                -45deg,
                var(--gold) 0px,
                var(--gold) 1px,
                transparent 1px,
                transparent 30px
            );
        }

        .hero-content {
            text-align: center;
            max-width: 900px;
            position: relative;
            z-index: 2;
            padding: 60px 0;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease forwards;
        }

        .hero-tag span {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .hero-tag-line {
            width: 40px;
            height: 1px;
            background: var(--gold);
        }

        .hero-eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            animation: fadeInUp 0.8s ease forwards;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(52px, 8vw, 96px);
            font-weight: 300;
            line-height: 1.05;
            color: var(--dark);
            margin-bottom: 16px;
            animation: fadeInUp 0.9s ease 0.1s both;
            letter-spacing: -1px;
        }

        .hero-title em {
            font-style: italic;
            color: var(--gold);
            font-weight: 300;
        }

        .hero-title-line2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-gray);
            display: block;
            margin-top: 10px;
            animation: fadeInUp 0.9s ease 0.2s both;
        }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 32px 0;
            animation: fadeInUp 0.9s ease 0.3s both;
        }

        .hero-divider-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .hero-divider-line:last-child {
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .hero-divider-diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
        }

        .hero-description {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.9;
            color: var(--text-gray);
            max-width: 560px;
            margin: 0 auto 40px;
            animation: fadeInUp 0.9s ease 0.4s both;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeInUp 0.9s ease 0.5s both;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: var(--white);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 18px 40px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            transition: left 0.3s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(184, 150, 90, 0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 17px 38px;
            border: 1px solid var(--mid-gray);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            margin-top: 70px;
            padding-top: 40px;
            border-top: 1px solid var(--mid-gray);
            animation: fadeInUp 0.9s ease 0.6s both;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 300;
            color: var(--dark);
            line-height: 1;
            display: block;
        }

        .stat-number .gold {
            color: var(--gold);
        }

        .stat-label {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-light);
            display: block;
            margin-top: 6px;
        }

        .stat-divider {
            width: 1px;
            height: 50px;
            background: var(--mid-gray);
        }

        /* STARS */
        .stars {
            display: flex;
            gap: 3px;
            justify-content: center;
            margin-bottom: 6px;
        }

        .star {
            color: var(--gold);
            font-size: 14px;
        }

        /* ABOUT STRIP */
        .about-strip {
            background: var(--dark);
            padding: 60px 40px;
