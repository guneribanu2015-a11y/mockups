<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odak Kuaför – The Hair Design Atelier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #b8965a;
            --gold-light: #d4b07a;
            --gold-dark: #8a6d3b;
            --dark: #1a1a1a;
            --dark-soft: #2d2d2d;
            --gray-text: #555555;
            --light-bg: #f9f7f4;
            --white: #ffffff;
            --accent-bg: #f3efe9;
            --border: #e8e0d5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--white);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* ===== NAV ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .nav-logo span:first-child {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            letter-spacing: 1px;
        }

        .nav-logo span:last-child {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-text);
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            display: inline-block;
            padding: 10px 24px;
            background: var(--gold);
            color: var(--white) !important;
            border-radius: 2px;
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-cta:hover {
            background: var(--gold-dark) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdfbf8 0%, #f5f0e8 50%, #ede5d8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 100px 24px 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,150,90,0.08) 0%, transparent 70%);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,150,90,0.06) 0%, transparent 70%);
        }

        .hero-content {
            text-align: center;
            max-width: 800px;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-block;
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 24px;
            padding: 8px 20px;
            border: 1px solid var(--gold-light);
            border-radius: 2px;
        }

        .hero-title {
            font-size: clamp(36px, 6vw, 72px);
            line-height: 1.15;
            color: var(--dark);
            margin-bottom: 16px;
            font-weight: normal;
        }

        .hero-title em {
            font-style: italic;
            color: var(--gold);
        }

        .hero-subtitle {
            font-family: 'Arial', sans-serif;
            font-size: clamp(13px, 2vw, 16px);
            color: var(--gray-text);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .hero-location {
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            color: var(--gray-text);
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .hero-location svg {
            color: var(--gold);
            flex-shrink: 0;
        }

        .hero-stars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 48px;
        }

        .stars-row {
            display: flex;
            gap: 3px;
        }

        .stars-row svg {
            fill: var(--gold);
        }

        .hero-rating-text {
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            color: var(--gray-text);
        }

        .hero-rating-text strong {
            color: var(--dark);
            font-weight: bold;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 40px;
            background: var(--gold);
            color: var(--white);
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(184,150,90,0.3);
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(184,150,90,0.4);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 40px;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            border: 1.5px solid var(--dark);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: var(--white);
        }

        .hero-scroll {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounce 2s infinite;
        }

        .hero-scroll span {
            font-family: 'Arial', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gray-text);
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 200px;
            margin: 0 auto 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gold-light);
        }

        .divider svg {
            fill: var(--gold);
            flex-shrink: 0;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            background: var(--dark);
            padding: 40px 24px;
        }

        .stats-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: var(--gold);
            line-height: 1;
        }

        .stat-label {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }

        /* ===== SECTION COMMON ===== */
        section {
            padding: 100px 24px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 64px;
        }

        .section-tag {
            display: inline-block;
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 48px);
            color: var(--dark);
            font-weight: normal;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .section-desc {
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            color: var(--gray-text);
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ===== ABOUT ===== */
        .about {
            background: var(--light-bg);
        }

        .about-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .about-visual {
            position: relative;
        }

        .about-frame {
            width: 100%;
            aspect-ratio: 4/5;
            background: linear-gradient(145deg, var(--accent-bg) 0%, var(--border) 100%);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .about-frame-inner {
            font-size: 120px;
            opacity: 0.3;
        }

        .about-badge-float {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .about-badge-float .num {
            font-size: 32px;
            color: var(--gold);
            display: block;
            line-height: 1;
        }

        .about-badge-float .lbl {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gray-text);
        }

        .about-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .about-tag {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .about-title {
            font-size: clamp(26px, 3vw, 40px);
            color: var(--dark);
            font-weight: normal;
            line-height: 1.3;
        }

        .about-text {
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            color: var(--gray-text);
            line-height: 1.8;
        }

        .about-features {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

            display:
