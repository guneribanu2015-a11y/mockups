<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maji Kuaför – Kadıköy Saç Kaynak & Güzellik Merkezi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96d;
    --gold-dark: #a07830;
    --dark: #1a1a2e;
    --text: #2d2d2d;
    --text-light: #555;
    --bg: #fafaf8;
    --bg-section: #f5f3ef;
    --white: #ffffff;
    --border: #e8e0d0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
  }

  .nav-logo-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .nav-logo-text span {
    color: var(--gold-dark);
    display: block;
    font-size: 0.7rem;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 30px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    transition: color 0.3s;
    font-family: Arial, sans-serif;
  }

  .nav-links a:hover { color: var(--gold-dark); }

  .nav-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white !important;
    padding: 10px 22px;
    border-radius: 25px;
    font-weight: bold;
    transition: all 0.3s !important;
    box-shadow: 0 4px 15px rgba(160,120,48,0.3);
  }

  .nav-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(160,120,48,0.4) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    padding: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 2px;
    background: var(--text);
    transition: 0.3s;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #fff9f0 0%, #fdf4e7 30%, #f8ede0 60%, #f0e4d4 100%);
    display: flex;
    align-items: center;
    padding-top: 70px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 5%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 60px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.08));
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold-dark);
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 0.82rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: 600;
    margin-bottom: 25px;
  }

  .hero-title {
    font-size: clamp(2rem, 4vw, 3.2rem);
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 15px;
  }

  .hero-title .highlight {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: 1.05rem;
    color: var(--text-light);
    line-height: 1.8;
    margin-bottom: 30px;
    font-family: Arial, sans-serif;
    font-weight: 400;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 35px;
  }

  .stars {
    display: flex;
    gap: 3px;
  }

  .stars span {
    color: var(--gold);
    font-size: 1.1rem;
  }

  .hero-stars p {
    color: var(--text-light);
    font-size: 0.9rem;
    font-family: Arial, sans-serif;
  }

  .hero-stars strong {
    color: var(--text);
  }

  .hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white;
    padding: 16px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 1rem;
    font-weight: bold;
    font-family: Arial, sans-serif;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(160,120,48,0.35);
    letter-spacing: 0.5px;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(160,120,48,0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: white;
    color: var(--text);
    padding: 16px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 1rem;
    font-family: Arial, sans-serif;
    transition: all 0.3s;
    border: 2px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    transform: translateY(-2px);
  }

  .hero-visual {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: flex-end;
  }

  .hero-card-main {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 380px;
  }

  .hero-card-main h3 {
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
  }

  .service-preview-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f5f5f5;
  }

  .service-preview-item:last-child { border-bottom: none; }

  .service-preview-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .service-preview-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .service-preview-name {
    font-size: 0.88rem;
    color: var(--text);
    font-family: Arial, sans-serif;
    font-weight: 600;
  }

  .service-preview-badge {
    font-size: 0.75rem;
    color: var(--gold-dark);
    background: rgba(201,168,76,0.12);
    padding: 3px 10px;
    border-radius: 12px;
    font-family: Arial, sans-serif;
  }

  .hero-cards-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }

  .mini-card {
    flex: 1;
    background: white;
    border-radius: 16px;
    padding: 20px 15px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }

  .mini-card .number {
    font-size: 1.6rem;
    font-weight: bold;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mini-card p {
    font-size: 0.75rem;
    color: var(--text-light);
    font-family: Arial, sans-serif;
    margin-top: 4px;
  }

  /* DECORATIVE */
  .ornament {
    color: var(--gold);
    font-size: 1.5rem;
    letter-spacing: 5px;
  }

  /* SECTION COMMON */
  section {
    padding: 90px 5%;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    color: var(--gold-dark);
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    color: var(--text);
    margin-bottom: 15px;
    line-height: 1.3;
  }

  .section-desc {
    color: var(--text-light);
    font-size: 1rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
    font-family: Arial, sans-serif;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 15px 0 0;
  }

  .divider-line {
    width: 50px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .divider-line.right {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .divider-diamond {
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* FEATURES */
  .features {
    background: var(--white);
    padding: 50px 5%;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .features-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
  }

  .feature-item {
    text-align: center;
    padding: 20px;
  }

  .feature-icon {
    font-size: 2rem;
    margin-bottom: 12px;
    display: block;
  }

  .feature-item h4 {
    color: var(--text);
