<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadıköy Kuaför – Maji Kuaför Saç Kaynak & Güzellik Merkezi</title>
<meta name="description" content="Kadıköy'ün en prestijli kuaförü. Saç kaynak, bakım, renklendirme ve güzellik hizmetleri. 4.9 yıldız ile 146 değerlendirme.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-pale: #f5e6c0;
    --dark: #1a1a1a;
    --dark-soft: #2d2d2d;
    --text: #333333;
    --text-light: #666666;
    --white: #ffffff;
    --bg-light: #fafaf8;
    --bg-section: #f7f5f0;
    --border: #e8e0d0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Raleway', sans-serif;
    background-color: var(--white);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ===== NAVIGATION ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s ease;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }

  nav.scrolled {
    box-shadow: 0 4px 30px rgba(0,0,0,0.1);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .nav-logo .logo-main {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.02em;
  }

  .nav-logo .logo-sub {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: var(--gold);
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--gold);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--gold) !important;
    color: var(--white) !important;
    padding: 10px 22px !important;
    border-radius: 2px;
    font-size: 0.78rem !important;
    letter-spacing: 0.12em !important;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.3s ease, transform 0.2s ease !important;
    display: inline-block;
  }

  .nav-cta:hover {
    background: var(--gold-light) !important;
    transform: translateY(-1px);
  }

  .nav-cta::after {
    display: none !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 8px;
    background: none;
    border: none;
  }

  .hamburger span {
    width: 24px;
    height: 2px;
    background: var(--dark);
    transition: all 0.3s ease;
    display: block;
  }

  .hamburger.open span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }

  .hamburger.open span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.open span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
  }

  .mobile-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 24px;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  }

  .mobile-menu.open {
    display: flex;
  }

  .mobile-menu a {
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s ease;
  }

  .mobile-menu a:hover {
    color: var(--gold);
  }

  .mobile-menu a:last-child {
    border-bottom: none;
    background: var(--gold);
    color: var(--white) !important;
    text-align: center;
    padding: 14px;
    border-radius: 2px;
    margin-top: 8px;
  }

  /* ===== HERO SECTION ===== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdfcf9 0%, #f7f3ea 40%, #efe8d8 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-decoration {
    position: absolute;
    top: 0;
    right: 0;
    width: 45%;
    height: 100%;
    background: linear-gradient(160deg, rgba(201,168,76,0.07) 0%, rgba(201,168,76,0.03) 100%);
    clip-path: polygon(20% 0%, 100% 0%, 100% 100%, 0% 100%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 120px 24px 80px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201, 168, 76, 0.1);
    border: 1px solid rgba(201, 168, 76, 0.3);
    padding: 8px 18px;
    border-radius: 50px;
    margin-bottom: 32px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hero-badge .stars {
    color: var(--gold);
    font-size: 0.85rem;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 12px;
    max-width: 700px;
  }

  .hero-title span {
    color: var(--gold);
    font-style: italic;
  }

  .hero-subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 400;
    font-style: italic;
    color: var(--text-light);
    margin-bottom: 20px;
    max-width: 580px;
  }

  .hero-desc {
    font-size: 0.95rem;
    color: var(--text-light);
    max-width: 500px;
    margin-bottom: 44px;
    font-weight: 400;
    line-height: 1.8;
  }

  .hero-buttons {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold);
    color: var(--white);
    text-decoration: none;
    padding: 16px 36px;
    font-family: 'Raleway', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 30px rgba(201, 168, 76, 0.35);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
  }

  .btn-primary:hover::before {
    left: 100%;
  }

  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(201, 168, 76, 0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--dark);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    transition: all 0.3s ease;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .btn-secondary:hover {
    color: var(--gold);
    border-color: var(--gold);
    gap: 14px;
  }

  .hero-stats {
    display: flex;
    gap: 48px;
    margin-top: 64px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ===== DIVIDER ===== */
  .ornament-divider {
    text-align: center;
    padding: 20px 0;
    color: var(--gold);
    font-size: 1.2rem;
    letter-spacing: 0.5em;
    opacity: 0.6;
  }

  /* ===== SECTION HEADER ===== */
  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-title span {
    color: var(--gold);
    font-style: italic;
  }

    align-items:
