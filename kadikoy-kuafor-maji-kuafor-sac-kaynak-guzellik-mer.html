<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maji Kuaför – Kadıköy Saç Kaynak & Güzellik Merkezi</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --dark: #1a1a2e;
    --dark-soft: #2d2d44;
    --text: #2c2c2c;
    --text-soft: #555;
    --white: #ffffff;
    --light-bg: #fafaf8;
    --light-gray: #f4f4f0;
    --border: #e8e0d0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .nav-logo-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.3px;
    line-height: 1.2;
  }

  .nav-logo-text span {
    display: block;
    font-size: 10px;
    color: var(--gold-dark);
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text-soft);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    font-weight: 500;
    transition: color 0.3s;
  }

  .nav-links a:hover {
    color: var(--gold-dark);
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark)) !important;
    color: white !important;
    padding: 10px 22px !important;
    border-radius: 25px;
    font-size: 12px !important;
    transition: all 0.3s !important;
    box-shadow: 0 4px 15px rgba(160,120,64,0.3);
  }

  .nav-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(160,120,64,0.4) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 68px;
    left: 0;
    right: 0;
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    z-index: 999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  .mobile-menu.open {
    display: block;
  }

  .mobile-menu a {
    display: block;
    padding: 14px 0;
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    border-bottom: 1px solid var(--light-gray);
    font-family: Arial, sans-serif;
  }

  .mobile-menu a:last-child {
    border-bottom: none;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white !important;
    text-align: center;
    padding: 14px;
    border-radius: 30px;
    font-weight: 600;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf9f4 0%, #f8f2e8 40%, #f0e8d8 100%);
    display: flex;
    align-items: center;
    padding: 90px 24px 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -150px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -100px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
  }

  .hero-container {
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.4);
    color: var(--gold-dark);
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 12px;
    font-family: Arial, sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .hero-title {
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.15;
    color: var(--dark);
    margin-bottom: 20px;
    font-weight: 700;
  }

  .hero-title .highlight {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: 16px;
    color: var(--text-soft);
    line-height: 1.8;
    margin-bottom: 36px;
    font-family: Arial, sans-serif;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white;
    padding: 16px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    font-family: Arial, sans-serif;
    box-shadow: 0 8px 30px rgba(160,120,64,0.35);
    transition: all 0.3s;
    letter-spacing: 0.3px;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(160,120,64,0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: white;
    color: var(--dark);
    padding: 16px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    font-family: Arial, sans-serif;
    border: 2px solid var(--border);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 32px;
  }

  .stat {
    text-align: center;
  }

  .stat-number {
    font-size: 28px;
    font-weight: 700;
    color: var(--dark);
    display: block;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-soft);
    font-family: Arial, sans-serif;
    letter-spacing: 0.5px;
  }

  .stat-divider {
    width: 1px;
    background: var(--border);
    align-self: stretch;
  }

  .hero-image-area {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .hero-card-main {
    background: white;
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    border: 1px solid var(--border);
    text-align: center;
  }

  .hero-card-icon {
    font-size: 64px;
    margin-bottom: 16px;
    display: block;
  }

  .hero-card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .hero-card-text {
    font-size: 13px;
    color: var(--text-soft);
    font-family: Arial, sans-serif;
    line-height: 1.6;
  }

  .hero-cards-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .hero-card-small {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.07);
    border: 1px solid var(--border);
    text-align: center;
    transition: transform 0.3s;
  }

  .hero-card-small:hover {
    transform: translateY(-4px);
  }

  .hero-card-small .icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
  }

  .hero-card-small .label {
    font-size: 12px;
    color: var(--text-soft);
    font-family: Arial, sans-serif;
  }

  .hero-card-small .value {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }

  /* RATING BADGE */
  .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 10px 20px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }

  .stars {
    color: #ffc107;
    letter-spacing: 2px;
  }

  /* SECTION COMMON */
  section {
    padding: 90px 24px;
  }

  .section-header {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 60px;
  }

  .section-tag {
    display: inline-block;
    background: rgba(201,169,110,0.12);
    color: var(--gold-dark);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 11px;
    font-family: Arial, sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 16px;
    border: 1px solid rgba(201,169,110,0.3);
  }

  .section-title {
    font-size: clamp(26px, 4vw, 40px);
    color: var(--dark);
    margin-bottom: 16px;
    font-weight: 700;
    line-height: 1.2;
  }

  .section-desc {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.8;
    font-family: Arial, sans-serif;
  }

  /* SERVICES */
  #hizmetler {
    background: var(--light-bg);
  }

  .services-container {
    max-width: 1100px;
    margin:
