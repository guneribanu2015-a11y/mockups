<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maji Kuaför – Kadıköy Saç Kaynak & Güzellik Merkezi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --dark: #1a1a2e;
    --text: #2d2d2d;
    --text-light: #5a5a5a;
    --white: #ffffff;
    --bg: #faf9f7;
    --bg2: #f4f0eb;
    --border: #e8e0d5;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Georgia', serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .nav-logo-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--dark);
    letter-spacing: 0.5px;
  }

  .nav-logo-text span {
    color: var(--gold-dark);
    display: block;
    font-size: 0.7rem;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.3s;
    font-family: 'Arial', sans-serif;
  }

  .nav-links a:hover { color: var(--gold-dark); }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white !important;
    padding: 8px 20px;
    border-radius: 25px;
    font-weight: bold !important;
    transition: all 0.3s !important;
    box-shadow: 0 3px 12px rgba(160,120,64,0.3);
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(160,120,64,0.45) !important;
    color: white !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 2px;
    background: var(--dark);
    transition: 0.3s;
    border-radius: 2px;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #fdfbf8 0%, #f5ede0 40%, #ede0cc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 5% 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 800px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--gold-light);
    border-radius: 30px;
    padding: 8px 20px;
    font-size: 0.82rem;
    color: var(--gold-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Arial', sans-serif;
    margin-bottom: 28px;
    box-shadow: 0 4px 15px rgba(201,169,110,0.15);
  }

  .hero-badge::before { content: '✦'; font-size: 10px; }

  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .hero h1 .gold-text {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--text-light);
    margin-bottom: 16px;
    font-style: italic;
  }

  .hero-location {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Arial', sans-serif;
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 40px;
  }

  .hero-location::before { content: '📍'; }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
  }

  .stars {
    color: #f0c040;
    font-size: 1.3rem;
    letter-spacing: 2px;
  }

  .rating-text {
    font-family: 'Arial', sans-serif;
    font-size: 0.9rem;
    color: var(--text-light);
  }

  .rating-text strong {
    color: var(--dark);
    font-size: 1.1rem;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: white;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Arial', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 25px rgba(160,120,64,0.35);
    transition: all 0.3s;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px rgba(160,120,64,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: white;
    color: var(--dark);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Arial', sans-serif;
    font-weight: 600;
    border: 2px solid var(--border);
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    transform: translateY(-3px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--text-light);
    font-size: 0.75rem;
    font-family: 'Arial', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: bounce 2s infinite;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }

  /* STATS */
  .stats {
    background: white;
    padding: 50px 5%;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stats-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    text-align: center;
  }

  .stat-item {
    padding: 20px 10px;
  }

  .stat-number {
    font-size: 2.2rem;
    font-weight: bold;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-family: 'Arial', sans-serif;
    font-size: 0.8rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-divider {
    width: 1px;
    background: var(--border);
    align-self: center;
    height: 50px;
    display: none;
  }

  /* SECTION COMMON */
  section { padding: 90px 5%; }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    font-family: 'Arial', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 14px;
  }

  .section-title {
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    color: var(--dark);
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .section-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(to right, var(--gold), var(--gold-dark));
    margin: 0 auto 20px;
    border-radius: 2px;
  }

  .section-desc {
    font-size: 1rem;
    color: var(--text-light);
    max-width: 550px;
    margin: 0 auto;
    font-style: italic;
  }

  /* HIZMETLER */
  .services {
    background: var(--bg2);
  }

  .services-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .service-card {
    background: white;
    border-radius: 20px;
    padding: 36px 28px;
    border: 1px solid var(--border);
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, var(--gold), var(--gold-dark));
    transform: scaleX(0);
    transition: transform 0.4s;
    transform-origin: left;
  }

  .service-card:hover::before { transform: scaleX(1); }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    border-color: var(--gold-light);
  }

  .service-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #fdf6ec, #f5e6cc);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 22px;
    border: 1px solid var(--gold-light);
  }

  .service-title {
    font-size: 1.2rem;
