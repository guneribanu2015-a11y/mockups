<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maji Kuaför – Kadıköy Saç Kaynak & Güzellik Merkezi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --dark: #1a1a2e;
    --dark2: #2d2d3e;
    --text: #2c2c2c;
    --text-light: #5a5a6a;
    --bg: #fafaf8;
    --bg2: #f4f2ee;
    --white: #ffffff;
    --border: #e8e4dc;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
  }

  .nav-logo span:first-child {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.5px;
  }

  .nav-logo span:last-child {
    font-size: 0.68rem;
    color: var(--gold-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold-dark); }

  .nav-btn {
    background: var(--gold);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    transition: background 0.3s, transform 0.2s !important;
  }

  .nav-btn:hover {
    background: var(--gold-dark) !important;
    color: var(--white) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 70px;
    left: 0; right: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 24px;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    text-decoration: none;
    color: var(--text);
    font-size: 1rem;
    font-weight: 500;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .mobile-menu a:last-child { border-bottom: none; }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 100px 24px 60px;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(201,169,110,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.10) 0%, transparent 50%);
  }

  .hero-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: repeating-linear-gradient(
      45deg,
      #c9a96e 0px,
      #c9a96e 1px,
      transparent 0px,
      transparent 50%
    );
    background-size: 40px 40px;
  }

  .hero-content {
    position: relative;
    text-align: center;
    max-width: 760px;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.4);
    color: var(--gold-light);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 28px;
  }

  .hero-badge::before { content: '✦'; color: var(--gold); }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .hero h1 span {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    color: rgba(255,255,255,0.65);
    margin-bottom: 36px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; }

  .hero-stars p {
    color: rgba(255,255,255,0.7);
    font-size: 0.88rem;
  }

  .hero-stars strong {
    color: var(--gold-light);
    font-weight: 600;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--white);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(201,169,110,0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(201,169,110,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    color: var(--white);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-3px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: bounce 2s infinite;
  }

  .hero-scroll span { font-size: 1.2rem; }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }

  /* STATS */
  .stats {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 40px 24px;
  }

  .stats-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .stat-item {
    background: var(--white);
    padding: 28px 20px;
    text-align: center;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold-dark);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* SECTION COMMON */
  section { padding: 80px 24px; }

  .section-header {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 56px;
  }

  .section-tag {
    display: inline-block;
    color: var(--gold-dark);
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.25;
    margin-bottom: 16px;
  }

  .section-desc {
    font-size: 1rem;
    color: var(--text-light);
    line-height: 1.7;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    margin: 16px auto 0;
    border-radius: 2px;
  }

  /* SERVICES */
  .services { background: var(--bg); }

  .services-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .service-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .service-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transform: scaleX(0);
    transition: transform 0.3s;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    border-color: var(--gold-light);
  }

  .service-card:hover::after { transform: scaleX(1); }

  .service-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 20px;
