<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacha Curl Kuaför, Güzellik ve Solaryum Salonu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --dark: #1a1a2e;
    --dark-text: #2c2c2c;
    --medium-text: #555555;
    --light-text: #888888;
    --white: #ffffff;
    --off-white: #fafaf8;
    --light-gray: #f4f4f0;
    --border: #e8e0d4;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Raleway', sans-serif;
    background-color: var(--white);
    color: var(--dark-text);
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    transition: all 0.4s ease;
  }

  nav.scrolled {
    box-shadow: 0 4px 30px rgba(0,0,0,0.08);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-logo-main {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--dark-text);
    letter-spacing: 0.5px;
  }

  .nav-logo-sub {
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--medium-text);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: var(--gold);
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--gold-dark);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--gold) !important;
    color: var(--white) !important;
    padding: 10px 22px !important;
    border-radius: 2px;
    text-decoration: none;
    font-size: 0.78rem !important;
    font-weight: 700 !important;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: background 0.3s ease, transform 0.2s ease !important;
    display: inline-block;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    background: var(--gold-dark) !important;
    color: var(--white) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }

  .hamburger span {
    display: block;
    width: 26px;
    height: 2px;
    background: var(--dark-text);
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 80px;
    left: 0;
    width: 100%;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    z-index: 999;
    padding: 20px 24px 28px;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    transform: translateY(-10px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .mobile-menu.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-menu a {
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--medium-text);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 14px 0;
    border-bottom: 1px solid var(--light-gray);
    transition: color 0.3s ease;
  }

  .mobile-menu a:hover {
    color: var(--gold);
  }

  .mobile-menu a:last-child {
    border-bottom: none;
    margin-top: 10px;
    background: var(--gold);
    color: var(--white);
    text-align: center;
    padding: 14px;
    border-radius: 2px;
  }

  .mobile-menu a:last-child:hover {
    background: var(--gold-dark);
    color: var(--white);
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdfcfa 0%, #f8f4ef 40%, #f2ece3 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 120px 24px 80px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
  }

  .hero-ornament-left {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.06;
    font-size: 280px;
    font-family: 'Playfair Display', serif;
    color: var(--gold-dark);
    user-select: none;
    pointer-events: none;
    font-style: italic;
  }

  .hero-ornament-right {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.06;
    font-size: 280px;
    font-family: 'Playfair Display', serif;
    color: var(--gold-dark);
    user-select: none;
    pointer-events: none;
    font-style: italic;
  }

  .hero-content {
    text-align: center;
    max-width: 820px;
    position: relative;
    z-index: 2;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 50px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .hero-badge span {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-dark);
  }

  .hero-badge .stars {
    color: var(--gold);
    font-size: 0.75rem;
    letter-spacing: 1px;
  }

  .hero-line {
    width: 60px;
    height: 1.5px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 28px;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    font-weight: 700;
    color: var(--dark-text);
    line-height: 1.15;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold-dark);
  }

  .hero-subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    font-weight: 400;
    font-style: italic;
    color: var(--medium-text);
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }

  .hero-desc {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--light-text);
    line-height: 1.8;
    margin-bottom: 48px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold);
    color: var(--white);
    text-decoration: none;
    padding: 16px 38px;
    font-family: 'Raleway', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 24px rgba(201,169,110,0.3);
  }

  .btn-primary:hover {
    background: var(--gold-dark);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(201,169,110,0.4);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--dark-text);
    text-decoration: none;
    padding: 16px 38px;
    font-family: 'Raleway', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-top: 64px;
    padding-top: 48px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--dark-text);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }

  .hero-stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--light-text);
  }

  /* ===== ABOUT STRIP ===== */
  .about-strip {
    background: var(--dark-text);
    padding: 24px 0;
    overflow: hidden;
  }

  .about-strip-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 0 24px;
  }

  .strip-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--white);
  }

  .strip-icon {
    width: 32px;
    height: 32px;
    background: var(--gold);
