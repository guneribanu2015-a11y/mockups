<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacha Curl Kuaför, Güzellik ve Solaryum Salonu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #b8860b;
            --primary-light: #d4a017;
            --primary-pale: #fdf6e3;
            --accent: #8b6914;
            --text-dark: #1a1a1a;
            --text-medium: #3d3d3d;
            --text-light: #666;
            --bg-white: #ffffff;
            --bg-light: #f9f7f4;
            --bg-section: #fdf9f5;
            --border: #e8ddd0;
            --shadow: rgba(184, 134, 11, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.07);
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .nav-logo-main {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .nav-logo-sub {
            font-size: 0.65rem;
            color: var(--text-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-medium);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--primary);
            transition: width 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--primary);
            color: white !important;
            padding: 10px 22px;
            border-radius: 2px;
            font-size: 0.78rem !important;
            letter-spacing: 2px !important;
            text-transform: uppercase !important;
            transition: background 0.3s !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background: var(--accent) !important;
            color: white !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--text-dark);
            transition: all 0.3s;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf9f0 0%, #fef5e4 40%, #fdf0d5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 5% 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 60%;
            height: 120%;
            background: radial-gradient(ellipse, rgba(212, 160, 23, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -10%;
            width: 50%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-ornament {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 80px;
            height: 80px;
            opacity: 0.12;
        }

        .hero-ornament-right {
            position: absolute;
            bottom: 20%;
            right: 5%;
            width: 60px;
            height: 60px;
            opacity: 0.1;
            transform: rotate(45deg);
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .hero-badge::before {
            content: '✦';
            font-size: 0.7rem;
        }

        .hero-badge::after {
            content: '✦';
            font-size: 0.7rem;
        }

        .hero-title {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            color: var(--primary);
            font-style: italic;
        }

        .hero-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--text-light);
            margin-bottom: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
        }

        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-medium);
            margin-bottom: 45px;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 16px 38px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(184, 134, 11, 0.4);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--primary);
            text-decoration: none;
            padding: 16px 38px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            border-radius: 2px;
            border: 1.5px solid var(--primary);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: var(--primary-pale);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-light);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            margin-top: 5px;
            display: block;
        }

        .stat-divider {
            width: 1px;
            background: var(--border);
            align-self: stretch;
        }

        /* DIVIDER */
        .section-divider {
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-size: 1.2rem;
            letter-spacing: 8px;
            opacity: 0.4;
        }

        /* ABOUT STRIP */
        .about-strip {
            background: var(--primary);
            padding: 22px 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .strip-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .strip-icon {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .strip-text {
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 500;
            opacity: 0.95;
        }

        .strip-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
        }

        /* SECTIONS */
        section {
            padding: 90px 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 65px;
        }

        .section-eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            font-family: 'Arial', sans-serif;
            font-weight: 700;
            margin-bottom: 15px;
            position: relative;
        }

        .section-eyebrow::before,
        .section-eyebrow::after {
            content: '—';
            margin: 0 10px;
            opacity: 0.5;
        }

        .section-title {
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .section-title em {
            font-style: italic;
            color: var(--primary);
        }

        .section-subtitle {
            font-size: 1rem;
            color: var(--text-light);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* SERVICES */
        #hizmetler {
            background: var(--bg-light);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2px;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--border);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .service-card {
            background: var(--bg-white);
            padding: 40px 35px;
            transition: all 0.3s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--primary);
            transition: height 0.4s;
        }

        .service-card:hover {
            background: var(--primary-pale);
        }

        .service-card:hover::before {
            height: 100%;
        }

        .service-icon {
            font-size: 2rem;
            margin-bottom: 20px;
            display: block;
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 12px;
            font-family: 'Georgia', serif;
        }

        .service-desc {
            font-size: 0.88rem;
            color: var(--text
