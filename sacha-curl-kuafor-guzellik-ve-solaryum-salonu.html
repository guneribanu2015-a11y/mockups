<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacha Curl | Kuaför, Güzellik ve Solaryum Salonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --dark: #1a1a2e;
            --text: #2d2d2d;
            --text-light: #5a5a5a;
            --bg: #fafaf8;
            --white: #ffffff;
            --light-gray: #f4f3f0;
            --border: #e8e4dc;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 0.5px;
        }

        .nav-logo span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            background: var(--gold);
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.85rem !important;
            transition: background 0.3s, transform 0.2s !important;
        }

        .nav-cta:hover {
            background: #b8943e !important;
            color: var(--white) !important;
            transform: translateY(-1px);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--dark);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px 28px;
            z-index: 999;
            flex-direction: column;
            gap: 18px;
        }

        .mobile-menu.open {
            display: flex;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfbf7 0%, #f7f3ec 50%, #faf8f4 100%);
            padding: 100px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -80px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -60px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
        }

        .hero-content {
            max-width: 760px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .hero-badge .star {
            color: var(--gold);
            font-size: 0.9rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .hero-title .accent {
            color: var(--gold);
            font-style: italic;
        }

        .hero-sub {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--text-light);
            font-weight: 400;
            margin-bottom: 20px;
            font-style: italic;
        }

        .hero-desc {
            font-size: 1rem;
            color: var(--text-light);
            max-width: 560px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: var(--white);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(201,168,76,0.3);
        }

        .btn-primary:hover {
            background: #b8943e;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(201,168,76,0.4);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            color: var(--dark);
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1.5px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 56px;
            padding-top: 40px;
            border-top: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--dark);
            display: block;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        /* DIVIDER */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            margin: 0 auto 20px;
            border-radius: 2px;
        }

        /* SECTION */
        section {
            padding: 90px 24px;
        }

        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 14px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .section-desc {
            font-size: 0.98rem;
            color: var(--text-light);
            max-width: 540px;
            margin: 0 auto;
        }

        /* HIZMETLER */
        #hizmetler {
            background: var(--light-gray);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 36px 30px;
            border: 1px solid var(--border);
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            transform: scaleX(0);
            transition: transform 0.35s;
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(0,0,0,0.08);
        }

        .service-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #fdf6e3, #faefd1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 22px;
        }

        .service-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .service-desc {
            font-size: 0.88rem;
            color: var(--text-light);
            line-height: 1.75;
            margin-bottom: 18px;
        }

        .service-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .service-items li {
            font-size: 0.84rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-items li::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--gold);
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* NEDEN BIZ */
        #neden-biz {
            background: var(--white);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .feature-item {
            text-align: center;
            padding: 36px 24px;
            border-radius: 20px;
            background: var(--light-gray);
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }

        .feature-item:hover {
            transform: translateY(-4px);
        }

        .feature-emoji {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 16px;
        }

        .feature-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 0.86rem;
            color: var(--text-light);
            line-height: 1.7;
        }

        /*
