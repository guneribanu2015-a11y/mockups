<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kuaför RAFET - Kadıköy'ün en prestijli kuaför salonu. Profesyonel saç kesimi, boyama ve bakım hizmetleri.">
<title>Kuaför RAFET | Kadıköy İstanbul</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --dark: #1a1a2e;
    --text: #2c2c2c;
    --text-light: #555;
    --bg: #fafafa;
    --bg-section: #f4f1ee;
    --white: #ffffff;
    --border: #e0d9d0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .nav-logo-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.5px;
  }

  .nav-logo-text span {
    color: var(--gold);
  }

  .nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s;
    letter-spacing: 0.3px;
  }

  .nav-links a:hover {
    color: var(--gold);
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--white) !important;
    padding: 9px 22px;
    border-radius: 25px;
    font-weight: 600 !important;
    transition: transform 0.3s, box-shadow 0.3s !important;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(201,168,76,0.4);
    color: var(--white) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 5px;
  }

  .hamburger span {
    display: block;
    width: 25px;
    height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: 0.3s;
  }

  /* MOBILE NAV */
  .mobile-menu {
    display: none;
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 5%;
    z-index: 999;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  .mobile-menu.open {
    display: block;
  }

  .mobile-menu a {
    display: block;
    padding: 12px 0;
    text-decoration: none;
    color: var(--text);
    font-size: 1rem;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s;
  }

  .mobile-menu a:last-child {
    border-bottom: none;
    margin-top: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--white);
    text-align: center;
    padding: 13px;
    border-radius: 25px;
    font-weight: 600;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf8f0 0%, #f9f3e8 40%, #f4ede0 100%);
    display: flex;
    align-items: center;
    padding: 100px 5% 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.3);
    color: #8a6f2e;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    text-transform: uppercase;
  }

  .hero-title {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800;
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .hero-title span {
    color: var(--gold);
    position: relative;
  }

  .hero-subtitle {
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-weight: 300;
    color: var(--text-light);
    margin-bottom: 25px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hero-desc {
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 35px;
    max-width: 450px;
    line-height: 1.8;
  }

  .hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--white);
    padding: 15px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 5px 25px rgba(201,168,76,0.35);
    letter-spacing: 0.3px;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px rgba(201,168,76,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--dark);
    padding: 15px 32px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border: 2px solid var(--border);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-3px);
  }

  .hero-stats {
    display: flex;
    gap: 30px;
    margin-top: 45px;
    flex-wrap: wrap;
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat-num {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--dark);
    display: block;
    line-height: 1;
  }

  .hero-stat-label {
    font-size: 0.78rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .hero-stat-divider {
    width: 1px;
    background: var(--border);
    height: 40px;
    align-self: center;
  }

  /* HERO VISUAL */
  .hero-visual {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .hero-card-main {
    width: 300px;
    height: 380px;
    background: linear-gradient(145deg, var(--white), #fdf5e8);
    border-radius: 24px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    z-index: 2;
  }

  .hero-salon-icon {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 10px 30px rgba(201,168,76,0.3);
  }

  .hero-salon-name {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--dark);
    text-align: center;
  }

  .hero-salon-name span {
    display: block;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--text-light);
    margin-top: 4px;
  }

  .hero-stars {
    display: flex;
    gap: 4px;
    flex-direction: column;
    align-items: center;
  }

  .stars-row {
    display: flex;
    gap: 4px;
  }

  .star {
    color: var(--gold);
    font-size: 1.1rem;
  }

  .rating-text {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 5px;
    text-align: center;
  }

  .hero-floating-badge {
    position: absolute;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .badge-top {
    top: 20px;
    right: -20px;
  }

  .badge-bottom {
    bottom: 30px;
    left: -30px;
  }

  .badge-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  /* DIVIDER */
  .section-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0;
  }

  /* SECTION COMMON */
  section {
    padding: 90px 5%;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    background: rgba(201,168,76,0.1);
    color: #8a6f2e;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }
