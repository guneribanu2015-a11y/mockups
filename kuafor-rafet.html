<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuaför RAFET - Kadıköy İstanbul</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #b8973a;
    --gold-light: #d4af5a;
    --gold-pale: #f5ede0;
    --dark: #1a1a1a;
    --text: #2c2c2c;
    --text-light: #5a5a5a;
    --white: #ffffff;
    --bg: #fafaf8;
    --bg-section: #f4f1ec;
    --border: #e8e0d0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Raleway', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ===== NAVBAR ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s ease;
  }

  nav.scrolled {
    box-shadow: 0 2px 30px rgba(0,0,0,0.08);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 75px;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-logo .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 2px;
  }

  .nav-logo .brand-sub {
    font-size: 0.65rem;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    transition: color 0.3s;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: var(--gold);
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--gold);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--gold) !important;
    color: white !important;
    padding: 0.6rem 1.5rem !important;
    border-radius: 2px !important;
    letter-spacing: 1px !important;
    transition: background 0.3s ease, transform 0.2s ease !important;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    background: var(--gold-light) !important;
    transform: translateY(-1px);
    color: white !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }

  .hamburger span {
    display: block;
    width: 26px;
    height: 2px;
    background: var(--dark);
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 75px;
    left: 0;
    width: 100%;
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem 2rem;
    z-index: 998;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    transform: translateY(-10px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .mobile-menu.open {
    display: block;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-menu ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .mobile-menu ul li a {
    display: block;
    padding: 1rem 0;
    text-decoration: none;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s;
  }

  .mobile-menu ul li a:hover {
    color: var(--gold);
  }

  .mobile-menu ul li:last-child a {
    border-bottom: none;
    color: var(--gold);
    font-weight: 700;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdfbf7 0%, #f5ede0 50%, #ede5d8 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding-top: 75px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(184,151,58,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -150px;
    left: -150px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(184,151,58,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-decor-line {
    position: absolute;
    top: 0;
    right: 30%;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, rgba(184,151,58,0.2), transparent);
  }

  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: white;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 0.5rem 1.2rem;
    border-radius: 2px;
    margin-bottom: 2rem;
  }

  .hero-badge .dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 5vw, 5rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 1.5rem;
  }

  .hero-title span {
    color: var(--gold);
    display: block;
  }

  .hero-subtitle {
    font-size: 1rem;
    color: var(--text-light);
    max-width: 480px;
    margin-bottom: 2.5rem;
    font-weight: 400;
    line-height: 1.8;
  }

  .hero-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 3rem;
  }

  .btn-primary {
    display: inline-block;
    background: var(--gold);
    color: white;
    text-decoration: none;
    padding: 1rem 2.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(184,151,58,0.3);
  }

  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(184,151,58,0.4);
    color: white;
  }

  .btn-secondary {
    display: inline-block;
    background: transparent;
    color: var(--dark);
    text-decoration: none;
    padding: 1rem 2.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    border: 1.5px solid var(--dark);
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    background: var(--dark);
    color: white;
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 2.5rem;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--dark);
    line-height: 1;
  }

  .stat-number span {
    color: var(--gold);
  }

  .stat-label {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-light);
    font-weight: 500;
    margin-top: 0.3rem;
  }

  .stat-divider {
    width: 1px;
    height: 50px;
    background: var(--border);
    align-self: center;
  }

  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .hero-card {
    background: white;
    border-radius: 4px;
    padding: 3rem;
    box-shadow: 0 20px 80px rgba(0,0,0,0.08);
    position: relative;
    max-width: 380px;
    width: 100%;
    border: 1px solid var(--border);
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 100%;
    height: 100%;
    border: 1px solid var(--gold);
    border-radius: 4px;
    z-index: -1;
  }

  .card-icon {
    width: 60px;
    height: 60px;
    background: var(--gold-pale);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 0.5rem;
  }

  .card-text {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 2rem;
    line-height: 1.7;
  }

  .rating-display {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 1rem 1.2rem;
    background: var(--bg-section);
    border-radius: 4px;
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }

  .stars {
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 2px;
  }

  .rating-info {
    display: flex;
    flex-direction: column;
  }

  .rating-score {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--dark);
    line-height: 1
