<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaför RAFET | Kadıköy İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-dark: #a07830;
            --dark: #1a1a2e;
            --text: #2c2c2c;
            --text-light: #555;
            --bg: #fafaf8;
            --bg-alt: #f4f2ee;
            --white: #ffffff;
            --border: #e8e4dc;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(250, 250, 248, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .nav-logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
        }

        .nav-logo-text span {
            color: var(--gold-dark);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            font-family: 'Arial', sans-serif;
        }

        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600 !important;
            transition: all 0.3s !important;
            box-shadow: 0 4px 15px rgba(160, 120, 48, 0.3);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(160, 120, 48, 0.4) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 24px;
            border-bottom: 1px solid var(--border);
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mobile-menu ul a {
            text-decoration: none;
            color: var(--text);
            font-size: 1rem;
            font-family: 'Arial', sans-serif;
            display: block;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(160deg, #fdfcf8 0%, #f5f0e8 50%, #ede8de 100%);
            display: flex;
            align-items: center;
            padding: 100px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201, 168, 76, 0.15);
            border: 1px solid rgba(201, 168, 76, 0.4);
            color: var(--gold-dark);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.8px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .hero-title {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 700;
            color: var(--text);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .hero-title .accent {
            color: var(--gold-dark);
            display: block;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 32px;
            font-family: 'Arial', sans-serif;
            max-width: 440px;
            line-height: 1.8;
        }

        .hero-stars {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }

        .stars {
            display: flex;
            gap: 2px;
        }

        .star {
            color: var(--gold);
            font-size: 1.1rem;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
            font-size: 0.88rem;
            color: var(--text-light);
        }

        .rating-text strong {
            color: var(--text);
            font-weight: 700;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--white);
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(160, 120, 48, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(160, 120, 48, 0.45);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--text);
            padding: 16px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Arial', sans-serif;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold-dark);
        }

        .hero-visual {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-end;
        }

        .hero-card-main {
            background: var(--white);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .hero-card-main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
        }

        .card-icon-large {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .card-main-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .card-main-desc {
            font-size: 0.88rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            max-width: 360px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 18px;
            padding: 22px 20px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold-dark);
            display: block;
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.3px;
        }

        /* DIVIDER */
        .divider {
            text-align: center;
            padding: 20px 0;
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 8px;
        }

        /* SECTION HEADER */
        .section-header {
            text-align: center;
            margin-bottom: 56px;
        }

        .section-eyebrow {
            display: inline-block;
            font-size: 0.78rem;
            font-family: 'Arial', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-dark);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            color: var(--text);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .section-desc {
            font-size: 0.97rem;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .gold-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* HIZMETLER */
        .hizmetler {
            background: var(--bg-alt);
            padding: 100px 24px;
        }

        .services-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .service-card {
            background: var(--white);
            border-radius: 20px;
            padding: 32px 28px;
            border: 1px solid var(--border);
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
        }

        .service-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold
