<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lipstick Barber | Kadıköy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #1a1a2e;
    --accent: #c9a96e;
    --accent2: #e8c98a;
    --light: #f8f7f4;
    --lightgray: #f0eeea;
    --text: #2c2c2c;
    --textmuted: #6b6b6b;
    --white: #ffffff;
    --border: #e0ddd7;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--light);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--primary), #2d2d5e);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .nav-logo-text {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.5px;
  }

  .nav-logo-text span {
    color: var(--accent);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--accent); }

  .nav-cta {
    background: var(--primary) !important;
    color: var(--white) !important;
    padding: 9px 20px !important;
    border-radius: 8px !important;
    font-size: 0.85rem !important;
    transition: background 0.3s, transform 0.2s !important;
  }

  .nav-cta:hover {
    background: var(--accent) !important;
    color: var(--primary) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 68px;
    left: 0; right: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 5%;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    text-decoration: none;
    color: var(--text);
    font-size: 1rem;
    font-weight: 500;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.3s;
  }

  .mobile-menu a:last-child { border-bottom: none; }
  .mobile-menu a:hover { color: var(--accent); }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 120px 5% 80px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -150px; left: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 680px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.3);
    color: var(--accent2);
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .hero-badge::before {
    content: '✦';
    font-size: 10px;
  }

  .hero h1 {
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    color: var(--white);
    margin-bottom: 12px;
    letter-spacing: -1px;
  }

  .hero h1 .highlight {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: rgba(255,255,255,0.7);
    margin-bottom: 40px;
    line-height: 1.6;
    max-width: 480px;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 60px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--primary);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.3px;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(201,169,110,0.35);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(201,169,110,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-number {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }

  .hero-image-side {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .hero-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 24px;
    width: 220px;
    text-align: center;
  }

  .hero-card-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
    display: block;
  }

  .hero-card-title {
    color: var(--white);
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
  }

  .hero-card-desc {
    color: rgba(255,255,255,0.55);
    font-size: 0.78rem;
    line-height: 1.5;
  }

  .stars {
    display: flex;
    gap: 3px;
    justify-content: center;
    margin-bottom: 8px;
  }

  .star { color: var(--accent); font-size: 14px; }

  /* SECTION BASE */
  section { padding: 100px 5%; }

  .section-header {
    text-align: center;
    margin-bottom: 64px;
  }

  .section-tag {
    display: inline-block;
    background: linear-gradient(135deg, rgba(201,169,110,0.12), rgba(201,169,110,0.06));
    border: 1px solid rgba(201,169,110,0.25);
    color: #8a6820;
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .section-subtitle {
    font-size: 1.05rem;
    color: var(--textmuted);
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* HIZMETLER */
  .hizmetler { background: var(--white); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .service-card {
    background: var(--light);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    transition: all 0.35s;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    border-radius: 0 4px 4px 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    border-color: rgba(201,169,110,0.4);
    background: var(--white);
  }

  .service-card:hover::before { opacity: 1; }

  .service-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--primary), #2d2d5e);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 20px;
    transition: transform 0.3s;
  }

  .service-card:hover .service-icon { transform: scale(1.1) rotate(-3deg); }

  .service-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
  }

  .service-desc {
    font-size: 0.88rem;
    color: var(--textmuted);
    line-height: 1.65;
    margin-bottom: 20px;
  }

  .service-price {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

    background: linear-gradient(135
