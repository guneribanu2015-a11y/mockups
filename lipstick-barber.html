<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lipstick Barber | Kadıköy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --primary: #1a1a2e;
    --accent: #c9a84c;
    --accent2: #e8c76a;
    --light: #f8f8f6;
    --gray: #f0ede8;
    --text: #1a1a1a;
    --text-light: #555;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.5px;
  }

  .nav-logo span {
    color: var(--accent);
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text-light);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent); }

  .nav-cta {
    background: var(--accent);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 600 !important;
    font-size: 0.85rem !important;
    transition: background 0.2s, transform 0.2s !important;
  }

  .nav-cta:hover {
    background: var(--primary) !important;
    color: var(--white) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #f8f6f2 0%, #ede9e0 50%, #f5f0ea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(26,26,46,0.05) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 760px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--accent);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 28px;
    box-shadow: 0 2px 20px rgba(201,168,76,0.1);
  }

  .hero-badge::before {
    content: '✦';
    font-size: 0.7rem;
  }

  .hero h1 {
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 900;
    color: var(--primary);
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 12px;
  }

  .hero h1 .highlight {
    color: var(--accent);
    position: relative;
    display: inline-block;
  }

  .hero h1 .highlight::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
    opacity: 0.25;
    border-radius: 2px;
  }

  .hero-sub {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--text-light);
    margin-bottom: 16px;
    font-weight: 400;
    line-height: 1.6;
  }

  .hero-location {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-light);
    font-size: 0.9rem;
    margin-bottom: 40px;
  }

  .hero-location svg {
    color: var(--accent);
    flex-shrink: 0;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--primary);
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.2px;
    transition: all 0.3s;
    box-shadow: 0 8px 32px rgba(26,26,46,0.2);
  }

  .btn-primary:hover {
    background: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 16px 48px rgba(201,168,76,0.3);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    color: var(--primary);
    padding: 16px 36px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border: 2px solid rgba(26,26,46,0.12);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-3px);
  }

  .hero-stats {
    display: flex;
    gap: 48px;
    justify-content: center;
    margin-top: 64px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-size: 0.8rem;
    color: var(--text-light);
    letter-spacing: 0.5px;
    margin-top: 4px;
    display: block;
  }

  .stat-divider {
    width: 1px;
    background: rgba(26,26,46,0.1);
    height: 48px;
    align-self: center;
  }

  /* STARS */
  .stars {
    display: inline-flex;
    gap: 3px;
    margin-bottom: 8px;
  }

  .star {
    color: var(--accent);
    font-size: 1.1rem;
  }

  /* HIZMETLER */
  .services {
    padding: 100px 24px;
    background: var(--white);
  }

  .section-header {
    text-align: center;
    max-width: 580px;
    margin: 0 auto 64px;
  }

  .section-tag {
    display: inline-block;
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 900;
    color: var(--primary);
    line-height: 1.15;
    letter-spacing: -1px;
    margin-bottom: 16px;
  }

  .section-desc {
    color: var(--text-light);
    font-size: 1rem;
    line-height: 1.7;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .service-card {
    background: var(--light);
    border: 1px solid rgba(26,26,46,0.07);
    border-radius: 20px;
    padding: 32px 28px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform: scaleX(0);
    transition: transform 0.3s;
    transform-origin: left;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 24px 64px rgba(26,26,46,0.1);
    border-color: rgba(201,168,76,0.2);
  }

  .service-card:hover::before {
    transform: scaleX(1);
  }

  .service-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(201,168,76,0.25);
  }

  .service-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .service-desc {
    color: var(--text-light);
    font-size: 0.88rem;
    line-height: 1.65;
    margin-bottom: 16px;
  }

  .service-price {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.85rem;
  }

  /* WHY US */
  .why-us {
    padding: 80px 24px;
    background: var(--gray);
  }

  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 32px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .why-item {
    text-align: center;
    padding: 32px 24px;
    background: var(--white);
    border-radius: 20px;
    border: 1px solid rgba(26,26,46,0.06);
    transition: all 0.3s;
  }

  .why-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(26,26,46,0.08);
  }

  .why-icon {
    font-size: 2rem;
    margin-bottom: 16px;
    display: block;
  }

  .why-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .why-desc {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.6;
  }

  /* REVIEWS */
  .reviews {
    padding: 100px 24px;
    background: var(--white);
  }

  .reviews-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .review-card {
    background: var(--light);
    border: 1px solid rgba(26,26,46,0.07);
    border-radius: 20px;
    padding: 28px;
    transition: all 0.3s;
  }

  .review-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(26,26,46,0.08);
  }

  .review-stars {
    display: flex;
