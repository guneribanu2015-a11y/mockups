<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lipstick Barber - Kadıköy, İstanbul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #b8953f;
            --gold-light: #d4af6a;
            --dark: #1a1a1a;
            --text: #2c2c2c;
            --light-gray: #f8f7f5;
            --mid-gray: #eeece8;
            --white: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--white);
            color: var(--text);
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(184, 149, 63, 0.2);
            transition: box-shadow 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 2px 30px rgba(0,0,0,0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-logo span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            background: var(--gold) !important;
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 2px;
            font-size: 0.8rem !important;
            letter-spacing: 1.5px !important;
            transition: background 0.3s ease, transform 0.2s ease !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background: var(--gold-light) !important;
            transform: translateY(-1px);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s ease;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 75px;
            left: 0;
            width: 100%;
            background: var(--white);
            padding: 20px 30px;
            border-bottom: 1px solid var(--mid-gray);
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 14px 0;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--mid-gray);
            transition: color 0.3s;
        }

        .mobile-menu a:hover {
            color: var(--gold);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f7f5 0%, #ffffff 50%, #f5f0e8 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 75px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,149,63,0.07) 0%, transparent 70%);
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,149,63,0.05) 0%, transparent 70%);
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(184, 149, 63, 0.1);
            border: 1px solid rgba(184, 149, 63, 0.3);
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 25px;
        }

        .hero-badge::before {
            content: '★';
            font-size: 0.8rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero-title span {
            color: var(--gold);
            display: block;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 400;
            max-width: 460px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background: var(--gold);
            color: var(--white);
            padding: 16px 38px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(184, 149, 63, 0.3);
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(184, 149, 63, 0.4);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: var(--dark);
            padding: 16px 38px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
            border: 1.5px solid var(--dark);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: var(--white);
            transform: translateY(-2px);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 50px;
            padding-top: 40px;
            border-top: 1px solid var(--mid-gray);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
            display: block;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .hero-image-side {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-visual {
            width: 100%;
            max-width: 450px;
            height: 520px;
            background: linear-gradient(145deg, var(--mid-gray), #e8e0d0);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-visual::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(184, 149, 63, 0.3);
            border-radius: 2px;
        }

        .hero-icon-main {
            font-size: 8rem;
            opacity: 0.15;
        }

        .hero-visual-inner {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-visual-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gold);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 10px 40px rgba(184, 149, 63, 0.3);
        }

        .hero-visual-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--dark);
            font-weight: 600;
        }

        .hero-visual-sub {
            font-size: 0.8rem;
            color: #888;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .floating-card {
            position: absolute;
            background: var(--white);
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .floating-card.card-1 {
            bottom: 40px;
            left: -30px;
        }

        .floating-card.card-2 {
            top: 40px;
            right: -30px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(184, 149, 63, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--dark);
        }

        .card-sub {
            font-size: 0.72rem;
            color: #888;
            margin-top: 2px;
        }

        /* DIVIDER */
        .section-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-light), transparent);
            margin: 0 auto;
            max-width: 600px;
        }

        /* SECTION COMMONS */
        section {
            padding: 90px 30px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 65px;
        }

        .section-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .section-desc {
            font-size: 0.95rem;
            color: #777;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .gold-line {
            width: 50px;
            height: 2px;
            background: var(--gold);
            margin: 18px auto 0;
        }

        /* ABOUT STRIP */
