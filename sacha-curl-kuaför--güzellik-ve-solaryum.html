<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {

  /* ── SCROLLBAR ── */

    border-bottom: 1px solid rgba(201, 169, 110, 0.2);
    transition: all 0.3s ease;
  }

  nav.scrolled {
    height: 60px;
    background: rgba(26, 20, 16, 0.98);
  }

  .nav-logo {
    font-family: 'Cormorant Garamond', serif;

    font-weight: 600;
    color: var(--gold);

    text-decoration: none;
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-logo span {
    font-size: 0.6rem;
    font-family: 'Montserrat', sans-serif;

    letter-spacing: 4px;
    color: var(--gold-light);
    text-transform: uppercase;

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

    color: rgba(255,255,255,0.8);

    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;

  .nav-links a::after {

    width: 0; height: 1px;
    background: var(--gold);
    transition: width 0.3s ease;

  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    background: var(--gold);
    color: var(--dark) !important;
    padding: 0.55rem 1.4rem;
    border-radius: 2px;
    font-weight: 600 !important;
    transition: background 0.3s, transform 0.2s !important;
  }

  .nav-cta:hover { background: var(--gold-dark); transform: translateY(-1px); }
  .nav-cta::after { display: none !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 26px; height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 72px; left: 0; right: 0;
    background: rgba(26, 20, 16, 0.98);
    backdrop-filter: blur(12px);
    z-index: 999;
    padding: 2rem;
    flex-direction: column;
    gap: 1.5rem;
    border-bottom: 1px solid rgba(201,169,110,0.2);
    transform: translateY(-10px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .mobile-menu.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-menu a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(201,169,110,0.15);
    transition: color 0.3s;
  }

  .mobile-menu a:hover { color: var(--gold); }

  #hero {

    background: var(--dark);

  .hero-bg {

  .hero-pattern {

        transparent,

        rgba(201,169,110,0.03) 40px,
        rgba(201,169,110,0.03) 41px

      repeating-linear-gradient(

        transparent,
        transparent 40px,
        rgba(201,169,110,0.03) 40px,
        rgba(201,169,110,0.03) 41px

  }

  .hero-decor {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(700px, 90vw);
    height: min(700px, 90vw);
    border: 1px solid rgba(201,169,110,0.08);
    border-radius: 50%;
    animation: rotateSlow 30s linear infinite;
  }

  .hero-decor::before {
    content: '';

    inset: 30px;
    border: 1px solid rgba(201,169,110,0.06);
    border-radius: 50%;
  }

  .hero-decor::after {
    content: '';
    position: absolute;
    inset: 60px;
    border: 1px solid rgba(201,169,110,0.04);
    border-radius: 50%;
  }

  @keyframes rotateSlow {
    from { transform: translate(-50%,-50%) rotate(0deg); }
    to { transform: translate(-50%,-50%) rotate(360deg); }
  }

  .hero-eyebrow {

  .hero-title {
    font-family: 'Cormorant Garamond', serif;

    color: var(--white);
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 0.4rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold);
    font-weight: 300;
  }

  .hero-subtitle-line {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 4vw, 2.8rem);

    margin-bottom: 1.8rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.65s forwards;
  }

  .hero-desc {
    font-size: 0.88rem;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    line-height: 1.9;
    max-width: 520px;

    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.95s forwards;
  }

  .stars {
    display: flex;
    gap: 3px;
  }

  .stars span {
    font-size: 1rem;
    color: var(--gold);
  }

  .rating-text {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.1s forwards;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--gold);
    color: var(--dark);
    text-decoration: none;
    padding: 1rem 2.2rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.15);
    transition: left 0.4s ease;
  }

  .btn-primary:hover::before { left: 0; }
  .btn-primary:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(201,169,110,0.3); }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: transparent;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    padding: 1rem 2.2rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s ease;
  }

  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

  .hero-scroll {
    position: absolute;
    bottom: 2.5rem; left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.4s forwards;
  }
