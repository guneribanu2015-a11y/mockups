<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadıköy Salon Ay Saç Tasarım & Kaynak Merkezi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #b8860b;
            --gold-light: #d4a017;
            --gold-pale: #f5e6c8;
            --dark: #1a1a2e;
            --dark-gray: #2d2d2d;
            --medium-gray: #555;
            --light-gray: #f8f8f8;
            --white: #ffffff;
            --border: #e8e0d0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--white);
            color: var(--dark-gray);
            line-height: 1.7;
        }

        /* ===== NAVIGATION ===== */
        nav {
            background-color: var(--white);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 20px rgba(184, 134, 11, 0.12);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .nav-logo-text {
            display: flex;
            flex-direction: column;
        }

        .nav-logo-main {
            font-size: 15px;
            font-weight: bold;
            color: var(--dark);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .nav-logo-sub {
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark-gray);
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: white !important;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px !important;
            letter-spacing: 1px !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 3px 15px rgba(184, 134, 11, 0.35);
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(184, 134, 11, 0.45) !important;
            color: white !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 5px;
        }

        .hamburger span {
            width: 24px;
            height: 2px;
            background-color: var(--dark-gray);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .mobile-menu {
            display: none;
            background-color: var(--white);
            border-top: 1px solid var(--border);
            padding: 20px;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--dark-gray);
            font-size: 15px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: block;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            transition: color 0.3s;
        }

        .mobile-menu a:hover {
            color: var(--gold);
        }

        .mobile-menu .mobile-cta {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: white !important;
            text-align: center;
            border-radius: 30px;
            padding: 12px;
            border-bottom: none !important;
            margin-top: 5px;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            background-color: var(--light-gray);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(212, 160, 23, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(184, 134, 11, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(245, 230, 200, 0.4) 0%, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 60px,
                rgba(184, 134, 11, 0.015) 60px,
                rgba(184, 134, 11, 0.015) 61px
            );
            pointer-events: none;
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--gold-pale);
            border: 1px solid rgba(184, 134, 11, 0.3);
            color: var(--gold);
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 30px;
            margin-bottom: 30px;
        }

        .hero-badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--gold);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .hero-subtitle-top {
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: clamp(36px, 6vw, 72px);
            font-weight: normal;
            color: var(--dark);
            line-height: 1.15;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-title span {
            color: var(--gold);
            font-style: italic;
        }

        .hero-title-sub {
            font-size: clamp(16px, 2.5vw, 24px);
            font-weight: normal;
            color: var(--medium-gray);
            margin-bottom: 25px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
        }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .hero-divider-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold));
        }

        .hero-divider-line:last-child {
            background: linear-gradient(to left, transparent, var(--gold));
        }

        .hero-divider-icon {
            color: var(--gold);
            font-size: 18px;
        }

        .hero-description {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            color: var(--medium-gray);
            max-width: 540px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .stars {
            display: flex;
            gap: 3px;
        }

        .star {
            color: var(--gold);
            font-size: 20px;
        }

        .star-half {
            position: relative;
            display: inline-block;
        }

        .rating-text {
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            color: var(--medium-gray);
        }

        .rating-number {
            font-weight: bold;
            color: var(--dark-gray);
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(184, 134, 11, 0.4);
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(184, 134, 11, 0.5);
        }

        .btn-secondary {
            display: inline-block;
            text-decoration: none;
            background-color: transparent;
            color: var(--dark-gray);
            padding: 15px 38px;
            border-radius: 50px;
            font-family: 'Arial', sans-serif;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1.5px solid var(--border);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-3px);
        }

        .hero-scroll {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--gold);
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* ===== FEATURES STRIP ===== */
        .features-strip {
            background-color: var(--dark);
            padding: 25px 20px;
        }

        .features-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
        }

        .feature-icon {
            color: var(--gold);
            font-size: 22px;
        }

        .feature-text {
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e0e0e0;
        }

        /* ===== ABOUT SECTION ===== */
        .about {
            padding: 90px 20px;
            background-color: var(--white);
        }

        .about-container {
            max-width: 1100px;
            margin: 0 auto;
