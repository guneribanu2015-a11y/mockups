<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadıköy Salon Ay – Saç Tasarım & Kaynak Merkezi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #b8923a;
    --gold-light: #d4a855;
    --gold-pale: #f5e9d0;
    --dark: #1a1a1a;
    --mid: #3d3d3d;
    --soft: #6b6b6b;
    --bg: #fafaf8;
    --bg2: #f2f0eb;
    --white: #ffffff;
    --radius: 14px;
    --shadow: 0 8px 40px rgba(0,0,0,0.10);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--dark);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(184,146,58,0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    height: 70px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo .icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .nav-logo span {
    font-size: 1rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: -0.3px;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--mid);
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--white) !important;
    padding: 9px 22px;
    border-radius: 30px;
    font-size: 0.82rem !important;
    font-weight: 700 !important;
    transition: transform 0.2s, box-shadow 0.2s !important;
    box-shadow: 0 4px 16px rgba(184,146,58,0.35);
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(184,146,58,0.45) !important;
    color: var(--white) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px; height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #fff9f0 0%, #fdf5e4 40%, #f7efe0 100%);
    display: flex;
    align-items: center;
    padding: 100px 5% 60px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(184,146,58,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -60px;
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(184,146,58,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid rgba(184,146,58,0.3);
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 30px;
    margin-bottom: 22px;
    box-shadow: 0 2px 12px rgba(184,146,58,0.12);
  }

  .hero h1 {
    font-size: clamp(2rem, 4.5vw, 3.4rem);
    font-weight: 800;
    color: var(--dark);
    line-height: 1.18;
    margin-bottom: 18px;
    letter-spacing: -1px;
  }

  .hero h1 .highlight {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 1.05rem;
    color: var(--soft);
    margin-bottom: 32px;
    max-width: 440px;
    line-height: 1.75;
  }

  .hero-actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--white);
    text-decoration: none;
    padding: 16px 34px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 6px 28px rgba(184,146,58,0.40);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(184,146,58,0.50);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    color: var(--dark);
    text-decoration: none;
    padding: 15px 28px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 2px solid rgba(184,146,58,0.25);
    transition: all 0.25s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    gap: 28px;
    margin-top: 36px;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .stat-num {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--soft);
    font-weight: 500;
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .hero-visual {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .hero-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 24px 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(184,146,58,0.10);
    position: relative;
    overflow: hidden;
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--gold-light));
  }

  .hero-card-icon { font-size: 1.8rem; margin-bottom: 10px; }

  .hero-card h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }

  .hero-card p {
    font-size: 0.84rem;
    color: var(--soft);
    line-height: 1.55;
  }

  .stars-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .stars-row span { font-size: 0.9rem; color: #f5a623; }

  .stars-row .review-count {
    font-size: 0.8rem;
    color: var(--soft);
    font-style: italic;
  }

  /* ─── SECTION COMMON ─── */
  section { padding: 90px 5%; }

  .section-label {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(1.7rem, 3vw, 2.5rem);
    font-weight: 800;
    color: var(--dark);
    letter-spacing: -0.6px;
    line-height: 1.25;
    margin-bottom: 14px;
  }

  .section-sub {
    font-size: 1rem;
    color: var(--soft);
    max-width: 520px;
    line-height: 1.75;
    margin-bottom: 50px;
  }

  .max-w { max-width: 1100px; margin: 0 auto; }

  /* ─── HİZMETLER ─── */
  #hizmetler { background: var(--white); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }

  .service-card {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 28px 26px;
    border: 1px solid rgba(184,146,58,0.10);
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    position: relative;
    overflow: hidden;
  }

  .service-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.10);
    border-color: rgba(184,146,58,0.25);
  }

  .service-card:hover::after { transform: scaleX(1); }

  .service-icon {
    width: 52px; height: 52px;
    background: var(--gold-pale);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 18px;
  }

  .service-card h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .service-card p {
    font-size: 0.86rem;
    color: var(--soft);
    line-height: 1.65;
  }

  .service-tag {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.73rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--gold-pale);
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ─── NEDEN BİZ ─── */
  #neden { background: var(--bg2); }

  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }

  .why-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 30px 24px;
    text-align: center;
    box
