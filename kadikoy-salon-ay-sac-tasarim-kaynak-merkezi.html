<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadıköy Salon Ay – Saç Tasarım & Kaynak Merkezi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #b8924a;
    --gold-light: #d4a96a;
    --gold-pale: #f5ede0;
    --dark: #1a1a1a;
    --mid: #4a4a4a;
    --light: #7a7a7a;
    --bg: #fafaf8;
    --white: #ffffff;
    --section-bg: #f4f1ec;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(184,146,74,0.15);
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--mid);
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: var(--gold);
    color: var(--white) !important;
    padding: 9px 22px;
    border-radius: 4px;
    font-weight: 600 !important;
    transition: background 0.3s !important;
  }

  .nav-cta:hover { background: var(--gold-light) !important; color: var(--white) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--dark);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* MOBILE MENU */
  .mobile-menu {
    display: none;
    position: fixed;
    top: 68px; left: 0; right: 0;
    background: var(--white);
    border-bottom: 1px solid rgba(184,146,74,0.2);
    z-index: 999;
    flex-direction: column;
    padding: 16px 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    text-decoration: none;
    color: var(--mid);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 14px 28px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    letter-spacing: 0.03em;
    transition: color 0.2s, background 0.2s;
  }

  .mobile-menu a:hover { color: var(--gold); background: var(--gold-pale); }

  .mobile-menu a:last-child { border-bottom: none; }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdf8f2 0%, #f5ede0 40%, #faf5ee 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px 80px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,146,74,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,146,74,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner { max-width: 780px; position: relative; z-index: 1; }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid rgba(184,146,74,0.3);
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 50px;
    margin-bottom: 28px;
  }

  .hero-badge::before { content: '✦'; font-size: 0.65rem; }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .hero p {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--mid);
    line-height: 1.7;
    margin-bottom: 40px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 56px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold);
    color: var(--white);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 16px 36px;
    border-radius: 6px;
    letter-spacing: 0.02em;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(184,146,74,0.35);
  }

  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(184,146,74,0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 15px 32px;
    border-radius: 6px;
    border: 2px solid var(--gold);
    letter-spacing: 0.02em;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    background: var(--gold-pale);
    transform: translateY(-2px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-size: 0.78rem;
    color: var(--light);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
    display: block;
  }

  .stat-divider {
    width: 1px;
    height: 48px;
    background: rgba(184,146,74,0.25);
    align-self: center;
  }

  /* STARS */
  .stars {
    color: var(--gold);
    font-size: 1.1rem;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 4px;
  }

  /* SECTION COMMON */
  section { padding: 96px 24px; }

  .section-label {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    color: var(--dark);
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-sub {
    font-size: 1rem;
    color: var(--mid);
    line-height: 1.7;
    max-width: 540px;
  }

  .section-header {
    margin-bottom: 56px;
  }

  .section-header.center {
    text-align: center;
  }

  .section-header.center .section-sub {
    margin: 0 auto;
  }

  /* ABOUT STRIP */
  .about-strip {
    background: var(--white);
    border-top: 1px solid rgba(184,146,74,0.12);
    border-bottom: 1px solid rgba(184,146,74,0.12);
    padding: 56px 24px;
  }

  .about-strip-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1px 1fr 1px 1fr;
    gap: 0;
    align-items: center;
  }

  .about-item {
    text-align: center;
    padding: 20px 32px;
  }

  .about-icon {
    font-size: 2rem;
    margin-bottom: 12px;
    display: block;
  }

  .about-item h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .about-item p {
    font-size: 0.875rem;
    color: var(--light);
    line-height: 1.6;
  }

  .about-divider {
    width: 1px;
    height: 80px;
    background: rgba(184,146,74,0.2);
    margin: 0 auto;
  }

  /* SERVICES */
  .services { background: var(--section-bg); }

  .services-inner { max-width: 1100px; margin: 0 auto; }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }

  .service-card {
    background: var(--white);
    border-radius: 12px;
    padding: 36px 32px;
    border: 1px solid rgba(184,146,74,0.12);
    transition: all 0.35s;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 0;
    background: var(--gold);
    transition: height 0.35s;
  }

  .service-card:hover::before { height: 100%; }

  .service-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(184,146,74,0.12);
    border-color: rgba(184,146,74,0.3);
  }

  .service-icon {
    width: 52px;
    height: 52px;
    background: var(--gold-pale);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
    transition: background 0.3s;
  }

  .service-card:hover .service-icon { background: rgba(184,146,74,0.15); }

  .service-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
  }

  .service-card p {
    font-size: 0.875rem;
    color: var(--mid);
    line-height: 1.7;
    margin-bottom: 18px;
  }

  .service-items {
    list-style: none;
    display: flex;
    flex
