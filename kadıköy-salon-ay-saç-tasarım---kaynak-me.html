<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadıköy Salon Ay – Saç Tasarım & Kaynak Merkezi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5a3;
    --dark: #0f0f0f;
    --dark2: #1a1a1a;
    --dark3: #242424;
    --text: #e8e8e8;
    --text-muted: #9a9a9a;
    --white: #ffffff;
    --accent: #b87d4b;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--dark);
    color: var(--text);
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    transition: all 0.3s;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--gold);
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  .nav-logo span {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--accent));
    color: var(--dark) !important;
    padding: 10px 22px;
    border-radius: 30px;
    font-weight: 600 !important;
    font-size: 0.78rem !important;
    letter-spacing: 1px !important;
    transition: transform 0.2s, box-shadow 0.2s !important;
    text-decoration: none;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(201,169,110,0.4);
    color: var(--dark) !important;
  }

  /* HAMBURGER */
  .hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
    padding: 4px;
    background: none;
    border: none;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 998;
    background: rgba(10,10,10,0.97);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--text);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  .mobile-menu a:hover { color: var(--gold); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding: 120px 24px 80px;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(201,169,110,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(184,125,75,0.08) 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #111111 50%, #0d0d0d 100%);
  }

  .hero-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: float-up 8s infinite;
  }

  @keyframes float-up {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.6; transform: translateY(-20px) scale(1); }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-300px) scale(0.5); }
  }

  .hero-content { position: relative; z-index: 2; max-width: 860px; }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.25);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.75rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
    animation: fadeInDown 0.8s ease both;
  }

  .hero-badge::before {
    content: '✦';
    font-size: 0.6rem;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 10px;
    animation: fadeInDown 0.8s ease 0.1s both;
  }

  .hero-title em {
    font-style: italic;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 20px;
    animation: fadeInDown 0.8s ease 0.15s both;
  }

  .hero-desc {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 580px;
    margin: 0 auto 40px;
    font-weight: 300;
    animation: fadeInDown 0.8s ease 0.2s both;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInDown 0.8s ease 0.3s both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    color: var(--dark);
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(201,169,110,0.3);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(201,169,110,0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--text);
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,169,110,0.06);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-top: 70px;
    padding-top: 40px;
    border-top: 1px solid rgba(255,255,255,0.06);
    animation: fadeInDown 0.8s ease 0.4s both;
    flex-wrap: wrap;
  }

  .stat { text-align: center; }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* DIVIDER */
  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 20px;
  }

  /* SECTION STYLES */
  section { padding: 100px 24px; }

  .section-header {
    text-align: center;
    margin-bottom: 70px;
  }

  .section-tag {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: 600;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-desc {
    font-size: 0.95rem;
    color: var(--text-muted);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* SERVICES */
  .services { background: var(--dark2); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .service-card {
    background: var(--dark3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 36px 30px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s;
    cursor: default;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .service-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,169,110,0.05) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .service-card:hover {
    transform: translateY(-6px);
    border-color: rgba(201,169,110,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .service-card:hover::before,
  .service-card:hover::after { opacity: 1; }

  .service-icon {
    font-size: 2.2rem;
    margin-bottom: 20px;
    display: block;
    line-height: 1;
  }

  .service-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--white);
    margin-bottom: 12px;
  }

  .service-desc {
    font-size: 0.87rem;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .service-list {
    list-style: none;
    margin-top: 16px;
  }

  .service-list li {
    font-size: 0.82
