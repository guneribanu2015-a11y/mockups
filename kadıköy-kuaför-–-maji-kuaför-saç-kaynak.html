<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maji Kuaför – Kadıköy Saç Kaynak & Güzellik Merkezi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07c45;
    --black: #0d0d0d;
    --dark: #1a1a1a;
    --dark2: #242424;
    --gray: #6b6b6b;
    --gray-light: #f5f3f0;
    --white: #ffffff;
    --cream: #fdf9f4;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(13,13,13,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    transition: all 0.4s ease;
  }

  nav.scrolled {
    padding: 12px 40px;
    background: rgba(13,13,13,0.97);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.03em;
    text-decoration: none;
  }

  .nav-logo span { color: var(--white); font-weight: 400; font-style: italic; }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: var(--gold);
    color: var(--black) !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: background 0.3s, transform 0.2s !important;
  }

  .nav-cta:hover {
    background: var(--gold-light) !important;
    color: var(--black) !important;
    transform: translateY(-1px);
  }

  .burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .burger span {
    width: 26px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all 0.3s;
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 120px 24px 80px;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 60% 40%, rgba(201,169,110,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 80% at 10% 80%, rgba(201,169,110,0.06) 0%, transparent 60%),
      linear-gradient(160deg, #0d0d0d 0%, #1a1507 50%, #0d0d0d 100%);
  }

  .hero-grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .hero-particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: float-up linear infinite;
  }

  @keyframes float-up {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    10% { opacity: 0.7; transform: translateY(-10px) scale(1); }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 860px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,169,110,0.12);
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 50px;
    padding: 8px 20px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
    animation: fade-down 0.8s ease both;
  }

  .hero-badge .star-icon { font-size: 0.9rem; }

  @keyframes fade-down {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 12px;
    animation: fade-up 0.9s 0.15s ease both;
  }

  .hero-title .line1 { display: block; color: var(--white); }
  .hero-title .line2 { display: block; color: var(--gold); font-style: italic; }
  .hero-title .line3 { display: block; color: var(--white); font-size: 0.55em; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 8px; }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 28px auto;
    animation: fade-up 0.9s 0.3s ease both;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: rgba(255,255,255,0.65);
    font-weight: 300;
    line-height: 1.7;
    max-width: 580px;
    margin: 0 auto 40px;
    animation: fade-up 0.9s 0.4s ease both;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fade-up 0.9s 0.55s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: var(--black);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(201,169,110,0.35);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-primary:hover::after { opacity: 1; }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(201,169,110,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--white);
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.25);
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-2px);
    background: rgba(201,169,110,0.06);
  }

  .hero-stats {
    display: flex;
    gap: 48px;
    justify-content: center;
    margin-top: 72px;
    flex-wrap: wrap;
    animation: fade-up 0.9s 0.7s ease both;
  }

  .stat {
    text-align: center;
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
  }

  .stat-divider {
    width: 1px;
    height: 50px;
    background: rgba(201,169,110,0.25);
    align-self: center;
  }

  .scroll-indicator {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0.5;
    animation: bob 2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  .scroll-indicator span {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .scroll-indicator svg { color: var(--gold); }

  /* ── SECTION COMMONS ── */
  section { padding: 100px 24px; }

  .section-header {
    text-align: center;
    margin-bottom: 64px;
  }

  .section-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    position: relative;
  }

  .section-tag::before,
  .section-tag::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .section-tag::before { right: calc(100% + 10px); }
  .section-tag::after { left: calc(100% + 10px); }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-title em { color: var(--gold); font-style: italic; }

  .section-subtitle {
    font-size: 1rem;
    color: rgba(255,255,255,0.55);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.7;
    font-weight: 300;
  }

  /* ── SERVICES ── */
  #hizmetler {
    background: var(--dark);
    position: relative;
    overflow: hidden;
  }

  #hizmetler::before {
    content: '';
    position: absolute;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .services-container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .service-categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 2px;
