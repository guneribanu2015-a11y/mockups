<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV Hair Studio | Kadıköy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --dark: #1a1a1a;
            --text: #2d2d2d;
            --text-light: #666;
            --bg: #fafafa;
            --white: #ffffff;
            --light-gray: #f4f4f4;
            --border: #e8e8e8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* NAVIGATION */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--dark);
            text-transform: uppercase;
        }

        .nav-logo span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            background: var(--dark);
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 2px;
            transition: background 0.3s !important;
        }

        .nav-cta:hover {
            background: var(--gold) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s;
        }

        /* MOBILE MENU */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            padding: 24px;
            flex-direction: column;
            gap: 20px;
        }

        .mobile-menu.active {
            display: flex;
        }

        .mobile-menu a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f4ef 0%, #fff9f4 50%, #f4f0eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(201, 169, 110, 0.08) 0%, transparent 60%);
        }

        .hero-badge {
            display: inline-block;
            background: var(--white);
            border: 1px solid var(--gold-light);
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 32px;
            font-family: 'Arial', sans-serif;
        }

        .hero-content {
            max-width: 750px;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: clamp(52px, 10vw, 96px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .hero h1 .studio {
            display: block;
            font-size: clamp(16px, 3vw, 22px);
            letter-spacing: 8px;
            font-weight: 300;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hero-divider {
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 28px auto;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 48px;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--dark);
            color: var(--white);
            text-decoration: none;
            padding: 18px 40px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201, 169, 110, 0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 17px 40px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            border: 1px solid var(--dark);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: var(--white);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 72px;
            padding-top: 48px;
            border-top: 1px solid var(--border);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -1px;
        }

        .stat-label {
            display: block;
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            margin-top: 4px;
        }

        .stars-display {
            color: var(--gold);
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }

        /* FLOATING ELEMENTS */
        .hero-float-1,
        .hero-float-2 {
            position: absolute;
            border-radius: 50%;
            background: var(--gold-light);
            opacity: 0.15;
        }

        .hero-float-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }

        .hero-float-2 {
            width: 250px;
            height: 250px;
            bottom: 50px;
            left: -50px;
        }

        /* SECTION STYLES */
        section {
            padding: 100px 24px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-family: 'Arial', sans-serif;
            display: block;
            margin-bottom: 16px;
            text-align: center;
        }

        .section-title {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 700;
            color: var(--dark);
            text-align: center;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .section-subtitle {
            font-size: 16px;
            color: var(--text-light);
            text-align: center;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto 60px;
            line-height: 1.8;
        }

        .gold-line {
            width: 40px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto 20px;
        }

        /* SERVICES */
        #hizmetler {
            background: var(--white);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px 32px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold);
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            border-color: var(--gold-light);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-icon {
            font-size: 36px;
            margin-bottom: 20px;
            display: block;
        }

        .service-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .service-desc {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.8;
            font-family: 'Arial', sans-serif;
            margin-bottom: 20px;
        }

        .service-price {
            font-size: 13px;
            color: var(--gold);
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ABOUT */
        #hakkimizda {
            background: linear-gradient(135deg, #f8f4ef 0%, #fdfaf7 100%);
        }

        .about-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .about-visual {
            position: relative;
        }

        .about-main-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 60px 40px;
            text-align: center;
        }

        .about-icon-large {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .about-tagline {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .about-sub {
            font-size: 14px;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            line-height: 1.8;
        }

        .about-float-badge {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: var(--gold);
            color: var(--white);
            padding: 20px 24px;
            border-radius: 4px;
            text-align: center;
        }

        .about-float-badge .num {
            display: block;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .about-float-badge .txt {
            display: block;
            font-size: 11px;
            letter-spacing: 1px;
            font-family: 'Arial', sans-serif;
            margin-top: 4px;
        }

        .about-content h2 {
            font-size: 36px;
            font-weight: 700;
            color: var(--dark
