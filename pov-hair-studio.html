<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV Hair Studio | Kadıköy İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-dark: #a07830;
            --dark: #1a1a1a;
            --dark-mid: #2d2d2d;
            --gray-text: #4a4a4a;
            --light-gray: #f5f5f5;
            --white: #ffffff;
            --border: #e8e8e8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f9f9f7;
            color: var(--dark);
            overflow-x: hidden;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.07);
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--dark);
            text-transform: uppercase;
        }

        .nav-logo span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-text);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-btn {
            background: var(--gold);
            color: white !important;
            padding: 9px 22px;
            border-radius: 2px;
            transition: background 0.3s !important;
        }

        .nav-btn:hover {
            background: var(--gold-dark) !important;
            color: white !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger span {
            width: 25px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #f9f7f4 0%, #f0ece3 50%, #f5f2eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5% 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 750px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 8px 20px;
            margin-bottom: 30px;
            font-family: 'Arial', sans-serif;
        }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: 400;
            color: var(--dark);
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--gold);
            font-style: italic;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: var(--gray-text);
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Arial', sans-serif;
        }

        .hero-location {
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            margin-bottom: 40px;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 45px;
        }

        .stars {
            color: var(--gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .rating-text {
            font-size: 0.9rem;
            color: var(--gray-text);
            font-family: 'Arial', sans-serif;
        }

        .rating-num {
            font-weight: 700;
            color: var(--dark);
            font-size: 1.1rem;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background: var(--gold);
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid var(--gold);
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            border-color: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201,168,76,0.3);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 16px 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
            border: 2px solid var(--dark);
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: white;
            transform: translateY(-2px);
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 0 auto 60px;
            max-width: 300px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--gold);
            opacity: 0.4;
        }

        .divider-icon {
            color: var(--gold);
            font-size: 1rem;
        }

        /* SECTIONS */
        section {
            padding: 90px 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            font-family: 'Arial', sans-serif;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 400;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .section-title em {
            color: var(--gold);
            font-style: italic;
        }

        .section-desc {
            font-size: 1rem;
            color: var(--gray-text);
            font-family: 'Arial', sans-serif;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ABOUT STRIP */
        .about-strip {
            background: var(--dark);
            padding: 60px 5%;
            text-align: center;
        }

        .about-strip-inner {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .strip-item {
            color: white;
        }

        .strip-item-num {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
        }

        .strip-item-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            font-family: 'Arial', sans-serif;
        }

        /* SERVICES */
        .services {
            background: var(--white);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2px;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--border);
        }

        .service-card {
            background: white;
            padding: 45px 35px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--gold);
            transition: width 0.4s;
        }

        .service-card:hover::before {
            width: 100%;
        }

        .service-card:hover {
            background: #faf8f4;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            z-index: 1;
        }

        .service-icon {
            font-size: 2rem;
            margin-bottom: 20px;
            display: block;
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            font-family: 'Arial', sans-serif;
        }

        .service-desc {
            font-size: 0.9rem;
            color: var(--gray-text);
            line-height: 1.7;
            font-family: 'Arial', sans-serif;
            margin-bottom: 20px;
        }

        .service-items {
            list-style: none;
        }

        .service-items li {
            font-size: 0.83rem;
            color: var(--gray-text);
            font-family: 'Arial', sans-serif;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-items li:last-child {
            border-bottom: none;
        }

        .service-items li::before {
            content: '—';
            color: var(--gold);
            font-size: 0.7rem;
        }

        /* WHY US */
        .why-us {
            background: linear-gradient(135deg, #f9f7f4, #f2ede3);
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .why-card {
            text-align: center;
            padding: 40px 25px;
            background: white;
            border-radius: 2px;
            border-top: 3px solid var(--gold);
            transition: all 0.3s;
        }

        .why-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .why-icon {
            font-size: 2.5rem;
            margin-bottom: 20px;
            display: block;
        }

        .why-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }

        .why-desc {
            font-size: 0.85rem;
            color: var(--gray-text);
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }

        /* TESTIMONIALS */
        .testimonials {
            background: white;
        }

        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
