<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POV Hair Studio | Kadıköy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C9A96E;
    --gold-light: #E8C98A;
    --dark: #0D0D0D;
    --dark2: #1A1A1A;
    --dark3: #252525;
    --gray: #888888;
    --light: #F5F0E8;
    --white: #FFFFFF;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--dark);
    color: var(--white);
    overflow-x: hidden;
  }

  /* NAVBAR */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(13,13,13,0.95), rgba(13,13,13,0));
    transition: background 0.4s;
  }

  nav.scrolled {
    background: rgba(13,13,13,0.97);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    padding: 14px 40px;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
  }

  .nav-logo span {
    color: var(--white);
    font-weight: 300;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: var(--gold);
    color: var(--dark) !important;
    padding: 10px 24px !important;
    border-radius: 2px;
    font-weight: 600 !important;
    transition: background 0.3s, transform 0.2s !important;
  }

  .nav-cta:hover {
    background: var(--gold-light) !important;
    color: var(--dark) !important;
    transform: translateY(-1px);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--gold);
    transition: all 0.3s;
    border-radius: 2px;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--dark);
    z-index: 999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
  }

  .mobile-menu.active { display: flex; }

  .mobile-menu a {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--white);
    text-decoration: none;
    letter-spacing: 2px;
    transition: color 0.3s;
  }

  .mobile-menu a:hover { color: var(--gold); }

  .mobile-close {
    position: absolute;
    top: 24px; right: 40px;
    font-size: 2rem;
    color: var(--gold);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 50%, rgba(201,169,110,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 80%, rgba(201,169,110,0.05) 0%, transparent 50%),
      linear-gradient(135deg, #0D0D0D 0%, #1a1209 50%, #0D0D0D 100%);
  }

  .hero-lines {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .hero-line {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(201,169,110,0.3), transparent);
    animation: lineFade 4s ease-in-out infinite;
  }

  .hero-line:nth-child(1) { left: 20%; height: 60%; top: 20%; animation-delay: 0s; }
  .hero-line:nth-child(2) { left: 40%; height: 40%; top: 30%; animation-delay: 1s; }
  .hero-line:nth-child(3) { left: 60%; height: 70%; top: 10%; animation-delay: 2s; }
  .hero-line:nth-child(4) { left: 80%; height: 50%; top: 25%; animation-delay: 0.5s; }

  @keyframes lineFade {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.6; }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }

  .hero-tag {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,169,110,0.4);
    padding: 8px 20px;
    margin-bottom: 32px;
    border-radius: 1px;
    animation: fadeUp 0.8s ease forwards;
    opacity: 0;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 12px;
    animation: fadeUp 0.8s ease 0.2s forwards;
    opacity: 0;
  }

  .hero-title .gold { color: var(--gold); }
  .hero-title .thin {
    font-weight: 400;
    font-style: italic;
    font-size: 0.55em;
    display: block;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.6);
    margin-top: 8px;
  }

  .hero-subtitle {
    font-size: 1rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    margin-bottom: 50px;
    line-height: 1.8;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    animation: fadeUp 0.8s ease 0.4s forwards;
    opacity: 0;
    margin-top: 24px;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s ease 0.6s forwards;
    opacity: 0;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold);
    color: var(--dark);
    padding: 18px 42px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.88rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }

  .btn-primary:hover::before { left: 100%; }
  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(201,169,110,0.4);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--white);
    padding: 18px 42px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.88rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-2px);
  }

  .hero-stats {
    position: absolute;
    bottom: 50px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 60px;
    animation: fadeUp 0.8s ease 0.8s forwards;
    opacity: 0;
    z-index: 2;
    padding: 0 24px;
  }

  .stat-item { text-align: center; }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    display: block;
  }

  .stat-label {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .scroll-indicator {
    position: absolute;
    bottom: 30px;
    right: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }

  .scroll-indicator span {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    writing-mode: vertical-rl;
  }

  .scroll-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(1.1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* DIVIDER */
  .divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 0 auto 20px;
  }

  /* ABOUT STRIP */
  .about-strip {
    background: var(--gold);
    padding: 22px 40px;
    overflow: hidden;
  }

  .strip-inner {
    display: flex;
    gap: 60px;
    animation: stripScroll 20s linear infinite;
    white-space: nowrap;
  }

  .strip-item {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dark);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .strip-item::after {
    content: '✦';
    opacity: 0.5;
  }

  @keyframes stripScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* SECTION */
  section { padding: 120px 40px; }

  .section-header {
    text-align: center;
    margin-bottom: 80px;
  }

  .section-tag {
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .section-title em {
    font-style: italic;
    color: var(--gold);
  }

  .section-desc {
    color: rgba(255,255,255,0.5);
    font-size
