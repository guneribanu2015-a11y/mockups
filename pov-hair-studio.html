<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV Hair Studio - Kadıköy, İstanbul</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --gold-dark: #a07840;
            --dark: #1a1a1a;
            --dark-soft: #2d2d2d;
            --gray-text: #555555;
            --light-gray: #f7f5f2;
            --white: #ffffff;
            --border: #e8e0d5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--white);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* ========== NAVIGATION ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            box-shadow: 0 2px 30px rgba(0,0,0,0.08);
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .nav-logo-main {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 1px;
            line-height: 1;
        }

        .nav-logo-sub {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--gray-text);
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--dark);
            color: var(--white) !important;
            padding: 11px 25px;
            border-radius: 2px;
            letter-spacing: 1.5px;
            font-size: 0.78rem !important;
            transition: background 0.3s ease !important;
        }

        .nav-cta::after {
            display: none !important;
        }

        .nav-cta:hover {
            background: var(--gold-dark) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            background: none;
            border: none;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--dark);
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 75px;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            z-index: 999;
            padding: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu ul {
            list-style: none;
        }

        .mobile-menu ul li a {
            display: block;
            padding: 14px 40px;
            text-decoration: none;
            color: var(--dark);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            transition: color 0.3s, background 0.3s;
        }

        .mobile-menu ul li:last-child a {
            border-bottom: none;
        }

        .mobile-menu ul li a:hover {
            color: var(--gold-dark);
            background: var(--light-gray);
        }

        /* ========== HERO ========== */
        .hero {
            min-height: 100vh;
            background-color: var(--light-gray);
            background-image:
                radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 10% 80%, rgba(201,169,110,0.06) 0%, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 100px 40px 60px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(135deg, rgba(201,169,110,0.04) 0%, rgba(201,169,110,0.10) 100%);
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .hero-content {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-text {}

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .hero-eyebrow-line {
            width: 40px;
            height: 1px;
            background: var(--gold);
        }

        .hero-eyebrow span {
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-dark);
            font-weight: 600;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 5vw, 4.2rem);
            font-weight: 700;
            color: var(--dark);
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .hero-title em {
            font-style: italic;
            color: var(--gold-dark);
        }

        .hero-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 400;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 25px;
        }

        .hero-description {
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--gray-text);
            max-width: 440px;
            margin-bottom: 45px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background: var(--dark);
            color: var(--white);
            text-decoration: none;
            padding: 16px 38px;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: 'Raleway', sans-serif;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(160,120,64,0.3);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: var(--dark);
            text-decoration: none;
            padding: 15px 38px;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 2px;
            border: 1.5px solid var(--dark);
            transition: all 0.3s ease;
            font-family: 'Raleway', sans-serif;
        }

        .btn-secondary:hover {
            background: var(--dark);
            color: var(--white);
        }

        .hero-rating {
            margin-top: 50px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hero-rating-stars {
            display: flex;
            gap: 3px;
        }

        .star {
            color: var(--gold);
            font-size: 1.1rem;
        }

        .hero-rating-text {
            font-size: 0.82rem;
            color: var(--gray-text);
        }

        .hero-rating-text strong {
            color: var(--dark);
            font-weight: 700;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-card {
            background: var(--white);
            border-radius: 4px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 380px;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-light), var(--gold), var(--gold-light));
        }

        .hero-card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .hero-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .hero-card-sub {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 30px;
        }

        .hero-card-features {
            list-style: none;
            text-align: left;
            margin-bottom: 35px;
        }

        .hero-card-features li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--gray-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-card-features li:last-child {
            border-bottom: none;
        }

        .hero-card-features li::before {
            content: '✦';
            color: var(--gold);
            font-size: 0.6rem;
            flex-shrink: 0;
        }

        .hero-card-btn {
            display: block;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--white);
            text-decoration: none;
            padding: 14px;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: 'Raleway', sans-serif;
        }

        .hero-card-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* ========== SECTION COMMON ========== */
        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .section-eyebrow-line {
            width: 35px;
            height: 1px;
            background: var(--gold);
        }

        .section-eyebrow span {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-dark);
            font-weight: 600;
        }

        .section-title {
            font-family: 'Playfair Display',
