<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss Makass Bayan Kuaförü | Kadıköy İstanbul</title>
<meta name="description" content="Miss Makass Bayan Kuaförü ve Saç Kaynak Merkezi - Kadıköy İstanbul. Profesyonel saç bakımı, saç kaynağı ve güzellik hizmetleri.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose: #c9736a;
    --rose-dark: #a85a52;
    --rose-light: #f2d4d0;
    --rose-pale: #fdf6f5;
    --gold: #c8a97e;
    --gold-light: #f0e4d0;
    --dark: #1a1214;
    --dark-mid: #2e1f23;
    --text: #3d2b2f;
    --text-light: #7a5f63;
    --white: #ffffff;
    --off-white: #fefaf9;
    --border: #ead5d0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--off-white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── NAVBAR ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(26, 18, 20, 0.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(201, 115, 106, 0.2);
    transition: all 0.3s ease;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--gold);
    letter-spacing: 0.02em;
    text-decoration: none;
  }

  .nav-logo span { color: var(--rose); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    color: white !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.82rem !important;
    font-weight: 600 !important;
    letter-spacing: 0.06em !important;
    transition: all 0.3s ease !important;
    box-shadow: 0 4px 15px rgba(201,115,106,0.35);
  }

  .nav-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 25px rgba(201,115,106,0.45) !important;
    color: white !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    width: 24px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all 0.3s;
    display: block;
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--dark);
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(201,115,106,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 70% at 20% 80%, rgba(200,169,126,0.12) 0%, transparent 55%),
      linear-gradient(160deg, #1a1214 0%, #2e1f23 40%, #1a1214 100%);
  }

  .hero-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9736a' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .hero-orb-1 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,115,106,0.12) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    animation: float 8s ease-in-out infinite;
  }

  .hero-orb-2 {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,169,126,0.1) 0%, transparent 70%);
    bottom: -50px;
    left: -80px;
    animation: float 10s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 24px;
    max-width: 800px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(201,115,106,0.15);
    border: 1px solid rgba(201,115,106,0.3);
    color: var(--gold);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 50px;
    margin-bottom: 28px;
    animation: fadeDown 0.8s ease both;
  }

  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--rose);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.08;
    margin-bottom: 12px;
    animation: fadeDown 0.9s 0.1s ease both;
  }

  .hero-title .accent {
    color: transparent;
    -webkit-text-stroke: 1.5px var(--rose);
    font-style: italic;
  }

  .hero-title .gold { color: var(--gold); }

  .hero-subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    color: var(--gold);
    font-style: italic;
    font-weight: 400;
    margin-bottom: 20px;
    letter-spacing: 0.03em;
    animation: fadeDown 1s 0.2s ease both;
  }

  .hero-desc {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.55);
    max-width: 520px;
    margin: 0 auto 40px;
    line-height: 1.8;
    font-weight: 300;
    animation: fadeDown 1.1s 0.3s ease both;
  }

  .hero-stars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
    animation: fadeDown 1.1s 0.35s ease both;
  }

  .stars-icons { color: var(--gold); font-size: 1rem; letter-spacing: 2px; }
  .stars-text { color: rgba(255,255,255,0.6); font-size: 0.82rem; }
  .stars-num { color: var(--gold); font-weight: 600; }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeDown 1.2s 0.4s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    color: white;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: all 0.3s ease;
    box-shadow: 0 8px 30px rgba(201,115,106,0.4);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-primary:hover::before { opacity: 1; }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(201,115,106,0.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-2px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: fadeDown 1.5s 0.8s ease both;
  }

  .hero-scroll span {
    color: rgba(255,255,255,0.3);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .scroll-line {
    width: 1px;
    height: 50px;
    background: linear-gradient(to bottom, rgba(201,115,106,0.6), transparent);
    animation: scrollAnim 2s ease-in-out infinite;
  }

  @keyframes scrollAnim {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--dark-mid);
    border-top: 1px solid rgba(201,115,106,0.15);
    border-bottom: 1px solid rgba(201,115,106,0.15);
    padding: 28px 40px;
  }

  .stats-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 24px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
    display: block;
    line-height: 1;
    margin-
