<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss Makass Bayan Kuaförü | Kadıköy İstanbul</title>
<meta name="description" content="Miss Makass Bayan Kuaförü saç kaynak merkezi - Kadıköy İstanbul'da profesyonel kadın kuaförü hizmetleri. Saç kesim, boyama, kaynak ve daha fazlası.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #b8860b;
    --primary-light: #d4a017;
    --primary-pale: #f9f3e3;
    --accent: #8b6914;
    --text-dark: #1a1a1a;
    --text-medium: #4a4a4a;
    --text-light: #7a7a7a;
    --bg-white: #ffffff;
    --bg-light: #f8f6f2;
    --bg-cream: #fdf9f4;
    --border-light: #e8e0d0;
    --shadow-soft: 0 4px 30px rgba(0,0,0,0.08);
    --shadow-medium: 0 8px 40px rgba(0,0,0,0.12);
    --shadow-gold: 0 4px 20px rgba(184,134,11,0.25);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg-white);
    color: var(--text-dark);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-light);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 3px;
  }

  /* NAVBAR */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    transition: all 0.3s ease;
  }

  .navbar.scrolled {
    box-shadow: var(--shadow-soft);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-decoration: none;
  }

  .nav-logo-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .nav-logo-sub {
    font-size: 9px;
    font-weight: 500;
    color: var(--text-light);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-medium);
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--primary);
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--primary);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: var(--primary);
    color: white !important;
    padding: 10px 22px !important;
    border-radius: 2px;
    font-size: 11px !important;
    letter-spacing: 2px !important;
    transition: all 0.3s ease !important;
    text-decoration: none;
  }

  .nav-cta::after {
    display: none !important;
  }

  .nav-cta:hover {
    background: var(--accent) !important;
    color: white !important;
    transform: translateY(-1px);
    box-shadow: var(--shadow-gold);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 1.5px;
    background: var(--text-dark);
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-light);
    padding: 24px;
    z-index: 999;
    flex-direction: column;
    gap: 20px;
    transform: translateY(-10px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .mobile-menu.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-menu a {
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-medium);
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    transition: color 0.3s;
  }

  .mobile-menu a:hover {
    color: var(--primary);
  }

  .mobile-menu .mobile-cta {
    background: var(--primary);
    color: white !important;
    text-align: center;
    padding: 14px !important;
    border-radius: 2px;
    border-bottom: none !important;
    margin-top: 8px;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: var(--bg-cream);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding-top: 72px;
  }

  .hero-bg-pattern {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 80%, rgba(184,134,11,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(184,134,11,0.06) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(184,134,11,0.03) 0%, transparent 70%);
  }

  .hero-decoration-top {
    position: absolute;
    top: 80px;
    right: -60px;
    width: 320px;
    height: 320px;
    border: 1px solid rgba(184,134,11,0.12);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-decoration-top-2 {
    position: absolute;
    top: 120px;
    right: -20px;
    width: 220px;
    height: 220px;
    border: 1px solid rgba(184,134,11,0.08);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-decoration-bottom {
    position: absolute;
    bottom: -100px;
    left: -80px;
    width: 380px;
    height: 380px;
    border: 1px solid rgba(184,134,11,0.08);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--border-light);
    padding: 8px 16px;
    border-radius: 100px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-soft);
  }

  .hero-badge-dot {
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
  }

  .hero-badge span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--primary);
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 5vw, 68px);
    font-weight: 300;
    color: var(--text-dark);
    line-height: 1.12;
    margin-bottom: 12px;
  }

  .hero-title em {
    font-style: italic;
    color: var(--primary);
    font-weight: 400;
  }

  .hero-title-line {
    display: block;
  }

  .hero-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, var(--primary), transparent);
    margin: 24px 0;
  }

  .hero-subtitle {
    font-size: 14px;
    color: var(--text-medium);
    line-height: 1.8;
    margin-bottom: 36px;
    font-weight: 300;
    max-width: 440px;
  }

  .hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 48px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--primary);
    color: white;
    text-decoration: none;
    padding: 16px 36px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.3s ease;
    box-shadow: var(--shadow-gold);
  }

  .btn-primary:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(184,134,11,0.4);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-medium);
    text-decoration: none;
    padding: 16px 24px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid var(--border-light);
    border-radius: 2px;
    transition: all 0.3s ease;
    background: white;
  }

  .btn-secondary:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }

  .hero-stats {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .hero-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hero-stat-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--primary);
    line-height: 1;
  }

  .hero-stat-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-light);
  }

  .hero-stat-divider {
    width: 1px;
    background: var(--border-light);
    align-self: stretch;
  }

  /* HERO IMAGE SIDE */
  .hero-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .hero-image-frame {
