<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Kuaför – The Hair Design Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #0a0a0a;
    --charcoal: #1a1a1a;
    --dark: #111111;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-pale: #f5edd8;
    --white: #fafaf8;
    --grey: #888;
    --light-grey: #f0ede8;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--white);
    color: var(--charcoal);
    overflow-x: hidden;
  }

  /* ─── NAVBAR ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    padding: 22px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all .4s ease;
    background: transparent;
  }

  nav.scrolled {
    background: rgba(10,10,10,.96);
    backdrop-filter: blur(12px);
    padding: 15px 5%;
    box-shadow: 0 2px 30px rgba(0,0,0,.4);
  }

  .nav-logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .nav-logo span:first-child {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 1px;
  }

  .nav-logo span:last-child {
    font-size: .55rem;
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,.8);
    transition: color .3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0; right: 0;
    height: 1px;
    background: var(--gold);
    transform: scaleX(0);
    transition: transform .3s ease;
  }

  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { transform: scaleX(1); }

  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--black) !important;
    padding: 10px 24px;
    border-radius: 2px;
    font-weight: 600 !important;
    letter-spacing: 1.5px !important;
    transition: all .3s ease !important;
    box-shadow: 0 4px 20px rgba(201,168,76,.3);
  }

  .nav-cta:hover {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    transform: translateY(-1px);
    box-shadow: 0 6px 25px rgba(201,168,76,.5) !important;
  }

  .nav-cta::after { display: none !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 26px;
    height: 2px;
    background: var(--white);
    transition: all .3s;
    border-radius: 2px;
  }

  /* ─── HERO ─── */
  #hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--black);
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(201,168,76,.06) 0%, transparent 50%),
      linear-gradient(135deg, #0a0a0a 0%, #1a1510 40%, #0d0d0d 100%);
  }

  .hero-lines {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .hero-lines::before {
    content: '';
    position: absolute;
    top: -50%; left: 30%;
    width: 1px;
    height: 200%;
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,.15), transparent);
    animation: lineFloat 8s ease-in-out infinite;
  }

  .hero-lines::after {
    content: '';
    position: absolute;
    top: -50%; right: 35%;
    width: 1px;
    height: 200%;
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,.08), transparent);
    animation: lineFloat 12s ease-in-out infinite reverse;
  }

  @keyframes lineFloat {
    0%, 100% { transform: translateY(0) skewX(0deg); opacity: .6; }
    50% { transform: translateY(-30px) skewX(1deg); opacity: 1; }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 5%;
    max-width: 900px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(201,168,76,.1);
    border: 1px solid rgba(201,168,76,.3);
    border-radius: 50px;
    padding: 8px 20px;
    margin-bottom: 36px;
    animation: fadeDown .8s ease both;
  }

  .hero-badge span {
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .hero-badge::before {
    content: '✦';
    color: var(--gold);
    font-size: .7rem;
  }

  .hero-badge::after {
    content: '✦';
    color: var(--gold);
    font-size: .7rem;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.2rem, 8vw, 7rem);
    font-weight: 300;
    color: var(--white);
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 8px;
    animation: fadeUp .9s .2s ease both;
  }

  .hero-title em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,.5);
    margin-bottom: 50px;
    letter-spacing: 1px;
    animation: fadeUp .9s .35s ease both;
  }

  .hero-actions {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp .9s .5s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--black);
    text-decoration: none;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 18px 40px;
    border-radius: 3px;
    transition: all .35s ease;
    box-shadow: 0 8px 35px rgba(201,168,76,.35);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; right: 0; bottom: 0;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    transition: left .35s ease;
    z-index: -1;
  }

  .btn-primary:hover::before { left: 0; }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 45px rgba(201,168,76,.5);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    color: var(--white);
    text-decoration: none;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 18px 40px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,.25);
    transition: all .35s ease;
  }

  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    transform: translateY(-3px);
    background: rgba(201,168,76,.05);
  }

  .hero-stats {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: 60px;
    animation: fadeUp .9s .7s ease both;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-size: .6rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
    margin-top: 5px;
    display: block;
  }

  .stat-divider {
    width: 1px;
    height: 50px;
    background: rgba(201,168,76,.2);
    align-self: center;
  }

  .hero-scroll {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: fadeIn 1s 1.2s ease both;
  }

  .hero-scroll span {
    font-size: .55rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,.3);
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(201,168,76,.6), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: .4; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(1.1); }
  }

  /* ─── SECTION COMMONS ─── */
  section { padding: 110px 5%; }

  .section-header {
    text-align: center;
    margin-bottom: 80px;
  }

  .section-tag {
    display: inline-block;
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    position: relative;
  }

  .section-tag::before, .section-tag::after {
    content: '—';
    margin: 0 10px;
    opacity: .5;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 300;
    color: var(--charcoal);
    line-height: 1.15;
    margin-bottom: 18px;
  }

  .section-title em { font-style: italic; color: var(--gold); }

  .section-desc {
    font-size: .85rem;
    font-weight: 300;
    color: var(--grey);
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.9;
    letter-spacing: .3px;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(to right, var(--gold), var(--gold-light));
    margin: 28px auto 0;
    border-radius: 2px;
  }

  /* ─── ABOUT STRIP ─── */
  #about {
    background: var(--dark);
    padding: 80px 5%;
  }

  .about-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-
