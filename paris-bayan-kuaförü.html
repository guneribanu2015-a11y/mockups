<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris Bayan Kuaförü | Kadıköy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #c9a96e;
    --rose-light: #e8d5b0;
    --dark: #1a1a1a;
    --mid: #2e2e2e;
    --soft: #f8f4ef;
    --text: #4a4a4a;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(26,26,26,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,169,110,0.25);
    transition: padding .3s;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--rose);
    letter-spacing: 2px;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.78);
    text-decoration: none;
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color .3s;
  }

  .nav-links a:hover { color: var(--rose); }

  .nav-cta {
    background: var(--rose);
    color: var(--dark) !important;
    padding: 10px 22px;
    border-radius: 30px;
    font-weight: 600 !important;
    transition: background .3s, transform .2s !important;
  }

  .nav-cta:hover {
    background: var(--rose-light) !important;
    transform: translateY(-1px);
    color: var(--dark) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--rose);
    border-radius: 2px;
    transition: all .3s;
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26,26,26,0.98);
    z-index: 998;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    color: var(--white);
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    letter-spacing: 2px;
    transition: color .3s;
  }

  .mobile-menu a:hover { color: var(--rose); }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a1a 0%, #2e1f14 50%, #1a1a1a 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    padding: 120px 20px 80px;
  }

  .hero-bg-pattern {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(201,169,110,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(201,169,110,0.06) 0%, transparent 40%),
      radial-gradient(circle at 60% 80%, rgba(201,169,110,0.05) 0%, transparent 35%);
  }

  .hero-ornament {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(700px, 95vw);
    height: min(700px, 95vw);
    border: 1px solid rgba(201,169,110,0.1);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-ornament::after {
    content: '';
    position: absolute;
    inset: 30px;
    border: 1px solid rgba(201,169,110,0.06);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 750px;
  }

  .hero-tag {
    display: inline-block;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--rose);
    border: 1px solid rgba(201,169,110,0.4);
    padding: 7px 20px;
    border-radius: 30px;
    margin-bottom: 28px;
    animation: fadeUp .8s ease both;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 5.5rem);
    color: var(--white);
    line-height: 1.08;
    margin-bottom: 12px;
    animation: fadeUp .9s .1s ease both;
  }

  .hero-title em {
    font-style: italic;
    color: var(--rose);
  }

  .hero-subtitle {
    font-size: clamp(.85rem, 2vw, 1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 36px;
    animation: fadeUp 1s .2s ease both;
  }

  .hero-desc {
    font-size: .95rem;
    color: rgba(255,255,255,0.62);
    line-height: 1.9;
    max-width: 520px;
    margin: 0 auto 48px;
    animation: fadeUp 1s .3s ease both;
  }

  .hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 1s .4s ease both;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--rose), #b8924a);
    color: var(--dark);
    text-decoration: none;
    padding: 16px 38px;
    border-radius: 40px;
    font-weight: 700;
    font-size: .9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform .25s, box-shadow .25s;
    box-shadow: 0 8px 30px rgba(201,169,110,0.3);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(201,169,110,0.45);
  }

  .btn-outline {
    border: 1.5px solid rgba(201,169,110,0.5);
    color: var(--rose);
    text-decoration: none;
    padding: 16px 38px;
    border-radius: 40px;
    font-weight: 500;
    font-size: .9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all .25s;
  }

  .btn-outline:hover {
    background: rgba(201,169,110,0.1);
    border-color: var(--rose);
    transform: translateY(-3px);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-top: 70px;
    padding-top: 50px;
    border-top: 1px solid rgba(255,255,255,0.07);
    animation: fadeUp 1s .5s ease both;
    flex-wrap: wrap;
  }

  .stat { text-align: center; }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--rose);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: .7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  .scroll-indicator {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.3);
    font-size: .65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: bounce 2s infinite;
  }

  .scroll-indicator svg {
    width: 20px;
    height: 20px;
    stroke: var(--rose);
    fill: none;
    stroke-width: 1.5;
  }

  /* ── SECTION BASE ── */
  section { padding: 100px 20px; }

  .section-header {
    text-align: center;
    margin-bottom: 70px;
  }

  .section-tag {
    display: inline-block;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 16px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 18px;
  }

  .section-line {
    width: 50px;
    height: 2px;
    background: linear-gradient(90deg, var(--rose), transparent);
    margin: 0 auto;
  }

  /* ── ABOUT ── */
  #about {
    background: var(--soft);
    padding: 100px 20px;
  }

  .about-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .about-visual {
    position: relative;
  }

  .about-card {
    background: linear-gradient(135deg, var(--dark), var(--mid));
    border-radius: 24px;
    padding: 60px 40px;
    text-align: center;
    color: var(--white);
    position: relative;
    overflow: hidden;
  }

  .about-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(201,169,110,0.12), transparent 70%);
    border-radius: 50%;
  }

  .about-card-icon {
    font-size: 3.5rem;
    margin-bottom: 20px;
    display: block;
  }

  .about-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--rose);
    margin-bottom: 12px;
  }

  .about-card p {
    font-size: .85rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.8;
  }

  .about-badge {
    position: absolute;
    bottom: -18px;
    right: 30px;
    background: var(--rose);
    color: var(--dark);
    font-weight: 700;
    font-size: .75rem;
    padding: 10px 20px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .about-text h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    color: var(--dark);
    margin-bottom: 20px;
    line-height: 1.2;
  }

  .about-text h2 em {
    font-style: italic;
    color: var(--rose);
  }

  .about-text p {
    font-size: .9rem;
    color: var(--text);
    line-height: 2;
    margin-bottom: 20px;
  }

  .about-features {
    list-style: none;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .about-features li {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: .88rem;
    color: var(--text);
  }

  .about-features li::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--rose);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── SERVICES ── */
  #hizmetler {
